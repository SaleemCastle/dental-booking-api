      - { $ref: "#/components/parameters/TenantHeader" }
    get:
      tags: [Inventory]
      summary: List stock balances
      description: Requires inventory.view. Balances are sums of movement deltas for each item, location and nullable lot. Buckets without history are omitted.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
        - { name: item_id, in: query, schema: { type: integer, minimum: 1 } }
