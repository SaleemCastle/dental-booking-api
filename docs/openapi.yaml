openapi: 3.0.3
info:
  title: Dental Booking Backend API
  version: 2.0.0
  description: Laravel Sanctum API for dental clinics. Each tenant is one clinic. Authenticated clinic requests optionally select X-Tenant-Id; omission selects the migrated default clinic, never another membership. Current membership and an active clinic are required. Clinical data, roles, permission grants, selectors, aggregates and audit history are clinic-scoped. Users and permission definitions are global; role assignments are clinic-local. Controlled onboarding and tenant status changes require a separate platform operator grant; Clinic Admin permissions confer no platform authority. See docs/multi-tenancy.md and docs/tenant-operations.md. All JSON endpoints return the standard ApiEnvelope shape with success, statusCode, message, code, data, errors, meta, and requestId.
servers:
  - url: http://localhost:8000
    description: Local Laravel server
security:
  - sanctumBearer: []
tags:
  - name: Auth
  - name: Health
  - name: Dashboard
  - name: Patients
  - name: Appointments
  - name: Provider Availability
  - name: Dentists
  - name: Treatments
  - name: Inventory
  - name: Invoices
  - name: Payments
  - name: Payment Links
  - name: Clinical Notes
  - name: Tasks
  - name: Messages
  - name: Referrals
  - name: Users
  - name: Roles
  - name: Audit Logs
  - name: Insurance Estimates
  - name: Insurance Claims
  - name: Insurance Obligations
  - name: Insurance Remittances
  - name: Insurance Receipts
  - name: Tenants
  - name: Platform Tenants
  - name: Dental Charts
  - name: Treatment Plans
  - name: Patient Documents
  - name: Reporting
  - name: Communications
  - name: Communication Consent
  - name: Communication Governance
paths:
  /api/platform/tenants:
    get:
      tags: [Platform Tenants]
      summary: List clinic profiles including suspended tenants
      description: Requires a current platform operator grant. No clinic membership or X-Tenant-Id is required. The grant does not authorize clinical data access.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Standard ApiEnvelope with data array of Tenant profiles and pagination metadata; 25 per page. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Platform Tenants]
      summary: Provision a single-clinic tenant and initial admin atomically
      description: Requires a current platform operator grant. A globally unique idempotency_key replays an identical validated payload without changing credentials or status. Reuse with changed input returns 409. Admin email must be unused. Clinic creation, membership, default roles and provisioning audit commit together. See docs/tenant-operations.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionTenantRequest" }
      responses:
        "201": { description: Standard ApiEnvelope with data.tenant and data.initial_admin_id. }
        "200": { description: 'Identical retry; same tenant and initial admin ID, with current tenant status.' }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Idempotency key reused with different input or concurrent identity/slug conflict. }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/platform/tenants/{tenant}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Platform Tenants]
      summary: Retrieve a clinic profile
      description: Requires a current platform operator grant; includes suspended tenants.
      responses:
        "200": { description: Standard ApiEnvelope with data.tenant. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/platform/tenants/{tenant}/status:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      tags: [Platform Tenants]
      summary: Activate or suspend a tenant
      description: Requires a current platform operator grant. Suspension blocks subsequent protected clinic requests with existing tokens. Each transition records an audit atomically; repeated identical status emits no additional audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "200": { description: Standard ApiEnvelope with data.tenant. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/contacts:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { name: patient, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Communications]
      summary: List the patient's communication contacts
      description: Requires patient view permission. Returns contacts including addresses, verification and revocation metadata. See docs/communications.md.
      responses:
        "200": { description: Standard ApiEnvelope with data.contacts array. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Communications]
      summary: Register an unverified patient or authorized billing-copy contact
      description: Requires patient update permission. Verification and ownership fields cannot be supplied. A billing_copy must be authorized for this patient's named events; emergency contacts are never implicit recipients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, address, role, authorized_events]
              properties:
                channel: { type: string, enum: [email, sms] }
                address: { type: string, maxLength: 254, example: patient@example.test, description: Email or E.164 number matching the channel. }
                role: { type: string, enum: [patient, billing_copy] }
                authorized_events:
                  type: array
                  minItems: 1
                  maxItems: 9
                  uniqueItems: true
                  items: { type: string, enum: [payment.recorded, payment_link.created, payment_link.failed, payment_link.expired, appointment.confirmed, appointment.reminder, appointment.cancelled, appointment.rescheduled, task.reminder] }
      responses:
        "201": { description: Standard ApiEnvelope with data.contact; verified_at is null. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/contacts/{contact}/verify:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { name: patient, in: path, required: true, schema: { type: integer } }
      - { name: contact, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communications]
      summary: Attest verified contact control and patient billing disclosure authorization
      description: Requires patient update permission. Staff must verify the address and recipient relationship in person or by verified callback. This records staff attestation, not an automated verification challenge. Revoked contacts cannot be reverified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_method]
              properties:
                verification_method: { type: string, enum: [in_person, verified_callback] }
      responses:
        "200": { description: Standard ApiEnvelope with data.contact verification metadata. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/contacts/{contact}:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { name: patient, in: path, required: true, schema: { type: integer } }
      - { name: contact, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Communications]
      summary: Revoke communication authorization and preserve contact history
      description: Requires patient update permission. Stops unsent deliveries using this contact. Does not erase history or resend prior events.
      responses:
        "200": { description: Standard ApiEnvelope with data.contact and revoked_at. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/patients/{patient}/communications:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { name: patient, in: path, required: true, schema: { type: integer } }
      - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    get:
      tags: [Communications]
      summary: Inspect patient engagement communication history
      description: Requires patients.view. Tenant-scoped appointment and task notifications only; billing history requires invoice view access at the invoice endpoint. Excludes addresses, variables, bodies, recipient hashes and operation keys. See docs/patient-engagement.md.
      responses:
        "200":
          description: Standard ApiEnvelope with data array and pagination in meta.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ClinicNotification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/appointments/{appointment}/communications:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { name: appointment, in: path, required: true, schema: { type: integer } }
      - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    get:
      tags: [Communications]
      summary: Inspect appointment engagement communication history
      description: Requires appointments.view. Tenant-scoped appointment and task notifications only; billing history requires invoice view access at the invoice endpoint. Excludes addresses, variables, bodies, recipient hashes and operation keys. See docs/patient-engagement.md.
      responses:
        "200":
          description: Standard ApiEnvelope with data array and pagination in meta.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ClinicNotification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/invoices/{invoice}/communications:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { name: invoice, in: path, required: true, schema: { type: integer } }
      - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    get:
      tags: [Communications]
      summary: Inspect invoice communication and delivery history
      description: Requires invoice view permission. Tenant-scoped and private/no-store. Excludes addresses, recipient hashes, operation keys, message bodies, variables, credentials and checkout URLs. Configuration is managed by a trusted operator command. See docs/communications.md for worker and retry semantics.
      responses:
        "200":
          description: Standard ApiEnvelope with data array and pagination in meta.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ClinicNotification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/reports/appointments:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/ReportDateFrom" }
      - { $ref: "#/components/parameters/ReportDateTo" }
      - { $ref: "#/components/parameters/ReportDentist" }
    get:
      tags: [Reporting]
      summary: Report appointment volume and current status by scheduled date
      description: Requires appointment read access. Counts every status by scheduled start in UTC, including cancellations/no-shows. Empty dates are omitted. Maximum 366 inclusive dates. Clinic-scoped, private/no-store; no patient fields. See docs/reporting.md for metric definitions and export strategy.
      responses:
        "200":
          description: Aggregate report; meta.filters echoes date_from/date_to/dentist_id and meta.timezone is UTC.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/AppointmentReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/reports/providers:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/ReportDateFrom" }
      - { $ref: "#/components/parameters/ReportDateTo" }
      - { $ref: "#/components/parameters/ReportDentist" }
      - { $ref: "#/components/parameters/ReportPage" }
      - { $ref: "#/components/parameters/ReportPerPage" }
    get:
      tags: [Reporting]
      summary: Report provider activity and occupation of configured capacity
      description: Requires appointment read access. All current providers, including zero activity, ordered by ID. Capacity/occupied/utilization fields require provider_availabilities.view or admin; otherwise null. Unconfigured capacity is unknown; zero capacity has null utilization. Booked/completed minutes are planned durations by start date; occupied minutes union overlapping bookings intersected with current working hours minus breaks/time off, including cross-midnight carry-in. See docs/reporting.md. Private/no-store.
      responses:
        "200":
          description: Data array with meta.pagination, meta.filters and meta.timezone.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ProviderReport" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/reports/treatments:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/ReportDateFrom" }
      - { $ref: "#/components/parameters/ReportDateTo" }
      - { $ref: "#/components/parameters/ReportDentist" }
      - { $ref: "#/components/parameters/ReportPage" }
      - { $ref: "#/components/parameters/ReportPerPage" }
    get:
      tags: [Reporting]
      summary: Report appointment and completed-procedure counts by treatment
      description: Requires both appointment and treatment catalog read access. One completed appointment counts as one occurrence of its assigned catalog treatment; plan proposals and invoice quantities do not imply performance. Null treatments are excluded; inactive treatments remain included. Ordered by treatment ID. Clinic-scoped and private/no-store. See docs/reporting.md.
      responses:
        "200":
          description: Data array with meta.pagination, meta.filters and meta.timezone.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [treatment_id, appointment_count, completed_count]
                          properties:
                            treatment_id: { type: integer }
                            appointment_count: { type: integer, minimum: 0 }
                            completed_count: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/reports/billing:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/ReportDateFrom" }
      - { $ref: "#/components/parameters/ReportDateTo" }
      - { $ref: "#/components/parameters/ReportDentist" }
    get:
      tags: [Reporting]
      summary: Report issued totals, current outstanding balances and period collections
      description: Requires BOTH invoice and payment read access (including Billing/Auditor/Admin roles). The invoice cohort uses issued_at and current issued/partially_paid/paid statuses; excludes drafts/voids. paid_total and outstanding_balance use current balances, including payments after date_to. Collections instead use payments.paid_at, including older invoices. Currency totals are separate decimal strings. Provider attribution uses invoice.appointment.dentist_id; unlinked invoices are excluded only when a provider filter is supplied. Current-data report without a cross-query snapshot. Private/no-store. See docs/reporting.md.
      responses:
        "200":
          description: Currency aggregates with meta.filters and meta.timezone; empty results have by_currency=[] and no default currency.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data:
                        type: object
                        required: [by_currency]
                        properties:
                          by_currency: { type: array, items: { $ref: "#/components/schemas/BillingReportCurrency" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/reports/insurance:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/ReportDateFrom" }
      - { $ref: "#/components/parameters/ReportDateTo" }
    get:
      tags: [Reporting]
      summary: Report aggregate insurance workflow activity
      description: Requires exact insurance_reports.view and patients.view permissions in an active tenant. Returns counts only, with no patient identifiers, policy data, benefit amounts, or financial balances. Claim, appeal and authorization values are current states of records created in the selected date window; other sections use their recorded timestamps. Reported receipt, remittance and obligation observations are never represented as posted cash or settled balances. Each read is audited and private/no-store.
      responses:
        "200":
          description: Aggregate counts by insurance workflow and current status; meta.filters echoes the date window and meta.timezone identifies the application timezone.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/InsuranceReportSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/documents:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Patient Documents]
      summary: List patient documents
      description: Admin, Dentist, or patient_documents.view required. Private/no-store. Excludes deleted files. Default active; archived files require status=archived or all. Audits listed with the patient ID. See docs/patient-documents.md.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        "200":
          description: Standard envelope with data.documents and meta.pagination; storage locations are never returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          documents: { type: array, items: { $ref: "#/components/schemas/PatientDocument" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Patient Documents]
      summary: Upload a private patient document
      description: Admin or Dentist required; Dentist plus Receptionist denied unless Admin. Wildcard permissions cannot grant clinical writes. Multipart upload only. PDF, JPEG, PNG, WebP; maximum 20 MiB by default, configurable server-side. Detects MIME from bytes and requires a matching extension, a nonempty file and a valid filename up to 255 characters. Optional links must belong to this patient/clinic and agree when the note has an appointment. Archived patients are allowed. Server owns patient, storage, attribution, size, MIME and timestamps. Metadata and uploaded audit commit atomically; failed metadata/audit writes clean up the object. No URL is returned.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary }
                appointment_id: { type: integer, nullable: true }
                clinical_note_id: { type: integer, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/PatientDocumentEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: Private object storage unavailable; no usable document is created. }
  /api/patients/{patient}/documents/{document}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/PatientDocumentId"
    get:
      tags: [Patient Documents]
      summary: Get private document metadata
      description: Same read authorization as listing. Active and archived files are readable; deleted files and mismatched patient/clinic IDs return 404. Audits viewed before returning metadata. No disk, object key, or provider URL.
      responses:
        "200": { $ref: "#/components/responses/PatientDocumentEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Patient Documents]
      summary: Delete a private patient document
      description: Clinical write authorization. Commits an audited soft-delete before removing S3 bytes. Retains metadata/attribution for history; no restore endpoint. Repeated DELETE is idempotent and retries pending object deletion. A 503 still means access has been revoked; retry this DELETE. Successful purge records purged_at and a purged audit. Provider version retention is managed by the bucket lifecycle.
      responses:
        "200": { description: Standard success envelope; file access revoked and current object removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Access revoked; object purge pending. Retry DELETE. }
  /api/patients/{patient}/documents/{document}/download:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/PatientDocumentId"
    get:
      tags: [Patient Documents]
      summary: Download a private patient document
      description: Same read authorization as metadata, checked on every request. Authenticated API streams the private S3 object as an attachment with original filename, detected Content-Type, nosniff, and private/no-store. No redirects, signed bearer links, public or static URLs. Audits downloaded after the stream opens and before response bytes; this records access, not proof of completed client receipt. Errors use the JSON envelope.
      responses:
        "200":
          description: Binary attachment; this successful response is not a JSON envelope.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Private object unavailable; generic JSON error. }
  /api/patients/{patient}/documents/{document}/archive:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/PatientDocumentId"
    post:
      tags: [Patient Documents]
      summary: Archive a patient document
      description: Clinical write authorization. Idempotently stores archive timestamp/actor and archived audit together. Retains private bytes and authenticated download access. Hidden from the default active list. No unarchive endpoint.
      responses:
        "200": { $ref: "#/components/responses/PatientDocumentEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/patients/{patient}/insurance-estimates:
    get:
      tags: [Insurance Estimates]
      operationId: listInsuranceEstimates
      summary: List immutable insurance estimate snapshots
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: treatment_plan_id, in: query, schema: { type: integer, minimum: 1 }, description: Restrict results to estimates linked to this patient's plan. Requires treatment_plans.view. }
        - { name: latest_only, in: query, schema: { type: boolean }, description: 'With treatment_plan_id, return only the newest immutable snapshot per plan item.' }
      responses:
        '200': { description: ApiEnvelope with newest-first data array and meta.pagination. Requires patients.view and insurance_estimates.view; reads are audited. }
        '403': { description: Permission denied. }
    post:
      tags: [Insurance Estimates]
      operationId: createInsuranceEstimate
      summary: Create an informational provisional estimate
      description: Requires patients.view and insurance_estimates.create. Gross amount and currency are caller supplied; one explicitly selected rule is evaluated. Unknown or conflicting facts return unresolved reason codes. No financial ledger or benefit usage changes.
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceEstimateInput' }
            example: { service_date: '2030-02-14', treatment_description: 'Synthetic dental service', procedure_code: 'SYN-001', code_system: 'Synthetic', gross_amount: '125.00', currency: 'JMD', association_id: 42, benefit_rule_id: 7 }
      responses:
        '201': { description: ApiEnvelope with immutable data.estimate snapshot and calculation trace. }
        '403': { description: Permission denied. }
        '404': { description: Patient or selected tenant scoped source not found. }
        '422': { description: Invalid input or non-applicable plan version. }
  /api/treatment-plans/{treatment_plan}/items/{item}/insurance-estimates:
    post:
      tags: [Insurance Estimates]
      operationId: createTreatmentPlanItemInsuranceEstimate
      summary: Create an immutable provisional estimate from a treatment-plan item
      description: Requires treatment_plans.view, patients.view, and insurance_estimates.create. Description and gross are derived from the locked item; service date and currency must be supplied. Procedure codes are not inferred. Only a selected association and benefit rule may be supplied. Does not change the plan or financial records.
      parameters:
        - { name: treatment_plan, in: path, required: true, schema: { type: integer } }
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service_date, currency]
              properties:
                association_id: { type: integer, nullable: true, minimum: 1 }
                benefit_rule_id: { type: integer, nullable: true, minimum: 1, description: Explicitly selected rule; omitted means unresolved. }
                service_date: { type: string, format: date, example: '2030-04-01' }
                currency: { type: string, pattern: '^[A-Z]{3}$', example: JMD }
      responses:
        '201': { description: Standard envelope containing an immutable provisional estimate snapshot. }
        '403': { description: Permission denied. }
        '404': { description: Plan/item is not available in this patient and tenant scope. }
        '422': { description: Invalid or unsupported request fields. }
  /api/patients/{patient}/insurance-estimates/{estimate}:
    get:
      tags: [Insurance Estimates]
      operationId: showInsuranceEstimate
      summary: Retrieve an immutable estimate snapshot
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: estimate, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ApiEnvelope with data.estimate; read is audited. }
        '403': { description: Permission denied. }
        '404': { description: Estimate does not belong to this patient and tenant. }
  /api/patients/{patient}/insurance-estimates/{estimate}/supersede:
    post:
      tags: [Insurance Estimates]
      operationId: supersedeInsuranceEstimate
      summary: Create a new estimate snapshot superseding an earlier estimate
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: estimate, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceEstimateInput' }
      responses:
        '201': { description: ApiEnvelope with new data.estimate; original snapshot remains unchanged. }
        '403': { description: Permission denied. }
        '404': { description: Estimate does not belong to this patient and tenant. }
        '409': { description: Estimate already has a successor. }
  /api/patients/{patient}/insurance-prior-authorizations:
    get:
      tags: [Insurance Prior Authorizations]
      summary: List a patient's prior authorizations
      description: Requires patients.view and insurance_prior_authorizations.view. Patient and tenant scoped; private no-store and audited.
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, requested, pending, approved, partially_approved, denied, cancelled, expired] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Standard ApiEnvelope with paginated authorization records. }
        '403': { description: Explicit permission required. }
        '404': { description: Patient is outside current tenant. }
    post:
      tags: [Insurance Prior Authorizations]
      summary: Create a draft prior authorization request
      description: Requires insurance_prior_authorizations.manage. Association is required; policy revision, claim, treatment plan item, and estimate are optional. No insurer reference is generated.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PriorAuthorizationCreateInput' } } }
      responses: { '201': { description: Draft authorization created. }, '403': { description: Permission denied. }, '422': { description: Invalid lineage or exact money input. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}:
    get:
      tags: [Insurance Prior Authorizations]
      summary: Retrieve a prior authorization
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'Authorization, manual decisions and append-only history. Insurer identifiers are never returned.' }, '404': { description: 'Foreign patient or authorization.' } }
    patch:
      tags: [Insurance Prior Authorizations]
      summary: Update a draft authorization
      description: Requires insurance_prior_authorizations.manage and expected_version. Only draft records can change.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriorAuthorizationUpdateInput' } } } }
      responses: { '200': { description: Updated draft with incremented history version. }, '409': { description: Stale version or non-draft. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}/requests:
    post:
      tags: [Insurance Prior Authorizations]
      summary: Record that clinic staff sent a request
      description: This staff record does not prove insurer receipt. Requires insurance_prior_authorizations.manage.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriorAuthorizationRequestInput' } } } }
      responses: { '200': { description: Status becomes requested with immutable event. }, '409': { description: Invalid state or version. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}/decisions:
    post:
      tags: [Insurance Prior Authorizations]
      summary: Record a staff-entered insurer acknowledgment or decision
      description: Requires insurance_prior_authorizations.decide. Staff-entered provenance is retained; no direct insurer verification or approval is implied. Unknown authorized values remain null.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriorAuthorizationDecisionInput' } } } }
      responses: { '200': { description: Immutable decision appended to history. }, '409': { description: Request is not in requested or pending state. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}/claim:
    post:
      tags: [Insurance Prior Authorizations]
      summary: Associate an authorization with a claim
      description: Requires insurance_prior_authorizations.manage. Claim must belong to same tenant, patient and insurance association. Claim status and submission remain unchanged.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [claim_id], additionalProperties: false, properties: { claim_id: { type: integer, minimum: 1 } } } } } }
      responses: { '200': { description: Claim link appended to authorization history. }, '422': { description: Patient or association mismatch. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}/history:
    get:
      tags: [Insurance Prior Authorizations]
      summary: Retrieve immutable authorization lifecycle history
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Ordered append-only lifecycle events. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}/expire:
    post:
      tags: [Insurance Prior Authorizations]
      summary: Record expiry after explicit insurer validity date
      description: Requires insurance_prior_authorizations.manage. A past valid_through date from a recorded decision is mandatory.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Expiry event appended. }, '409': { description: No past explicit validity date. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}/cancel:
    post:
      tags: [Insurance Prior Authorizations]
      summary: Cancel a draft or pending authorization
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expected_version, reason], additionalProperties: false, properties: { expected_version: { type: integer, minimum: 1 }, reason: { type: string, minLength: 1, maxLength: 2000 } } } } } }
      responses: { '200': { description: Cancellation event appended. }, '409': { description: Authorization is terminal or version is stale. } }
  /api/patients/{patient}/insurance-prior-authorizations/{authorization}/evidence:
    get:
      tags: [Insurance Prior Authorizations]
      summary: Retrieve typed evidence associations
      description: Requires insurance_prior_authorizations.view, insurance_prior_authorizations.evidence, and insurance_documents.view. Does not return document bytes.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Audited evidence version associations. } }
    post:
      tags: [Insurance Prior Authorizations]
      summary: Link an immutable document version as supporting evidence
      description: Requires insurance_prior_authorizations.evidence and insurance_documents.view. Linking remains disabled by the existing insurance_evidence.linking_enabled setting; quarantined or non-clean versions are never referenceable.
      parameters: [{ name: patient, in: path, required: true, schema: { type: integer } }, { name: authorization, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriorAuthorizationEvidenceInput' } } } }
      responses: { '201': { description: Immutable evidence link created. }, '409': { description: Evidence linking is not activated or version is protected. } }
  /api/patients/{patient}/insurance-claims:
    get:
      tags: [Insurance Claims]
      summary: List a patient's insurance claims
      description: Requires patients.view and insurance_claims.view. Tenant and patient scoped; access is audited. Paginated newest first.
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, ready, submitted, cancelled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Standard ApiEnvelope containing claim array and pagination metadata. }
        '403': { description: Explicit claims view permission required. }
        '404': { description: Patient is outside current tenant. }
    post:
      tags: [Insurance Claims]
      summary: Create a draft insurance claim
      description: Requires patients.view and insurance_claims.prepare. An insurance association must be explicitly selected; policy and estimate references are optional. Claim identifier is local and is not an insurer identifier.
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceClaimDraftInput' }
      responses:
        '201': { description: Standard envelope containing the new draft claim. }
        '403': { description: Explicit claims prepare permission required. }
        '404': { description: Patient or selected association is outside patient/tenant scope. }
        '422': { description: Invalid or missing selected insurance association. }
  /api/patients/{patient}/insurance-claims/{claim}:
    get:
      tags: [Insurance Claims]
      summary: Retrieve a claim and its draft line snapshots
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Audited ApiEnvelope containing claim and lines. }
        '403': { description: Explicit claims view permission required. }
        '404': { description: Claim does not belong to patient and tenant. }
    patch:
      tags: [Insurance Claims]
      summary: Update optional draft source references
      description: Requires insurance_claims.prepare and a matching expected_version. An edit to ready returns it to draft. Association and patient identity cannot be changed.
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceClaimUpdateInput' }
      responses:
        '200': { description: Updated draft claim with incremented lock_version. }
        '403': { description: Explicit claims prepare permission required. }
        '404': { description: Claim or optional source outside patient/tenant scope. }
        '409': { description: Stale version or claim is submitted/cancelled. }
        '422': { description: Invalid source reference. }
  /api/patients/{patient}/insurance-claims/{claim}/lines:
    post:
      tags: [Insurance Claims]
      summary: Add a commercial line snapshot to a draft claim
      description: Exact decimal unit amounts, integer quantity, explicit currency/date and optional real code. PostgreSQL derives gross amount. Requires expected_version; editing ready returns claim to draft.
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceClaimLineInput' }
      responses:
        '201': { description: Claim and line snapshots with exact amounts. }
        '403': { description: Explicit claims prepare permission required. }
        '404': { description: Source item is outside the claim patient/tenant. }
        '409': { description: Stale version or claim is immutable. }
        '422': { description: 'Invalid line fields, currency or amount precision.' }
  /api/patients/{patient}/insurance-claims/{claim}/lines/{line}:
    patch:
      tags: [Insurance Claims]
      summary: Replace a draft claim line snapshot
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
        - { name: line, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceClaimLineInput' }
      responses:
        '200': { description: Updated claim and line; edit returns a ready claim to draft. }
        '403': { description: Explicit claims prepare permission required. }
        '404': { description: Claim line not found in the claim and patient scope. }
        '409': { description: Stale version or claim is immutable. }
        '422': { description: Invalid line. }
    delete:
      tags: [Insurance Claims]
      summary: Remove a line from a draft claim
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
        - { name: line, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedClaimVersion' }
      responses:
        '200': { description: Updated claim and incremented version. }
        '403': { description: Explicit claims prepare permission required. }
        '404': { description: Claim line not found in claim scope. }
        '409': { description: Stale version or claim is immutable. }
  /api/patients/{patient}/insurance-claims/{claim}/readiness:
    post:
      tags: [Insurance Claims]
      summary: Validate claim readiness
      description: '`ready` means locally validated only. It does not mean transmitted, acknowledged, approved, or paid. Requires insurance_claims.prepare and expected_version.'
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedClaimVersion' }
      responses:
        '200': { description: Claim plus ready boolean and structured reason_codes; successful validation changes draft to ready. }
        '403': { description: Explicit claims prepare permission required. }
        '404': { description: Claim outside patient/tenant scope. }
        '409': { description: Stale version or terminal claim. }
  /api/patients/{patient}/insurance-claims/{claim}/cancel:
    post:
      tags: [Insurance Claims]
      summary: Cancel a draft or ready claim
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceClaimCancelInput' }
      responses:
        '200': { description: Cancelled claim; submitted claims cannot be cancelled in M4-A. }
        '403': { description: Explicit claims prepare permission required. }
        '404': { description: Claim outside patient/tenant scope. }
        '409': { description: Stale version or invalid transition. }
  /api/patients/{patient}/insurance-claims/{claim}/submissions:
    get:
      tags: [Insurance Claims]
      summary: Retrieve immutable claim submission history
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Audited submission snapshots; submitted means clinic staff recorded the action, not confirmed insurer receipt.' }
        '403': { description: Explicit claims view permission required. }
        '404': { description: Claim outside patient/tenant scope. }
    post:
      tags: [Insurance Claims]
      summary: Record staff-submitted claim snapshot
      description: Requires insurance_claims.submit. Repeated idempotency key and identical metadata replays the same record. Acknowledgement is not inferred; no insurer API or financial ledger is called.
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 120, example: postman-claim-submit-001 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceClaimSubmitInput' }
      responses:
        '201': { description: Immutable snapshot and submitted claim; insurer receipt remains unconfirmed. }
        '200': { description: Identical idempotent replay. }
        '403': { description: Explicit claims submit permission required. }
        '404': { description: Claim outside patient/tenant scope. }
        '409': { description: 'Stale version, invalid state, duplicate key with changed data, or conflicting submission.' }
        '422': { description: Claim not ready or invalid submission metadata. }
  /api/patients/{patient}/insurance-claims/{claim}/events:
    get:
      tags: [Insurance Claims]
      summary: Retrieve append-only lifecycle history
      parameters:
        - { name: patient, in: path, required: true, schema: { type: integer } }
        - { name: claim, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Audited ordered event history. }
        '403': { description: Explicit claims view permission required. }
        '404': { description: Claim outside patient/tenant scope. }
  /api/insurance/receipts:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Insurance Receipts]
      summary: List manually recorded insurer receipts
      description: Requires insurance_receipts.view and active tenant membership. Receipt observations are not posted payments; remittance advice is not proof of payment.
      parameters:
        - { name: insurer_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { description: Paginated private/no-store receipt history. }
        '403': { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Insurance Receipts]
      summary: Record manual insurer receipt evidence
      description: Requires insurance_receipts.record. Creates nonposting evidence only. UUID Idempotency-Key required.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsurerReceiptInput' }
      responses:
        '201': { description: Immutable nonposting receipt evidence recorded. }
        '200': { description: Identical idempotent replay. }
        '409': { description: Duplicate external reference or conflicting idempotency key. }
        '422': { $ref: "#/components/responses/ValidationError" }
  /api/insurance/receipts/{receipt}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: receipt, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Insurance Receipts]
      summary: Retrieve receipt and verification history
      description: Requires insurance_receipts.view. Verification stays separate from the posted payment ledger.
      responses:
        '200': { description: Receipt and optional immutable verification record. }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
  /api/insurance/receipts/{receipt}/verification:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: receipt, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Insurance Receipts]
      summary: Append manual receipt verification observation
      description: Requires insurance_receipts.verify. Exact observed amount and currency must match; verification does not allocate or post cash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsurerReceiptVerificationInput' }
      responses:
        '201': { description: Immutable staff verification observation appended. }
        '403': { $ref: "#/components/responses/Forbidden" }
        '409': { description: Already verified or amount/currency differs. }
        '422': { $ref: "#/components/responses/ValidationError" }
  /api/insurance/obligations:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Insurance Obligations]
      summary: List explicit insurer obligation proposals and approvals
      description: Requires insurance_obligations.view, invoices.view and patients.view. Finance-entered amounts only; claim decisions and remittance amounts are never inferred as liability. No invoice/payment posting occurs.
      parameters:
        - { name: invoice_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: insurer_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: approval_status, in: query, schema: { type: string, enum: [proposed, approved] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { description: Paginated private/no-store obligation history. }
        '403': { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Insurance Obligations]
      summary: Record a proposed insurer obligation
      description: Requires insurance_obligations.propose, invoices.view and patients.view. Amount is an explicit proposal, not inferred liability. UUID Idempotency-Key required.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsurerObligationProposalInput' }
      responses:
        '201': { description: Immutable proposal recorded. }
        '200': { description: Identical idempotent replay. }
        '409': { description: Idempotency key conflict. }
        '422': { $ref: "#/components/responses/ValidationError" }
  /api/insurance/obligations/{obligation}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: obligation, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Insurance Obligations]
      summary: Retrieve an obligation and immutable approval history
      description: Requires insurance_obligations.view, invoices.view and patients.view.
      responses:
        '200': { description: Proposal and optional finance approval history. }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
  /api/insurance/obligations/{obligation}/approve:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: obligation, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Insurance Obligations]
      summary: Approve a proposed insurer obligation
      description: Requires insurance_obligations.approve, invoices.view and patients.view. Approval records the proposal amount unchanged. This records no payment, allocation, receivable, balance change, or financial posting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approval_reason]
              properties:
                approval_reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: Immutable finance approval recorded. }
        '200': { description: Identical idempotent replay. }
        '403': { $ref: "#/components/responses/Forbidden" }
        '409': { description: 'Already approved, ineligible invoice, or idempotency conflict.' }
        '422': { $ref: "#/components/responses/ValidationError" }
  /api/insurance/remittances:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Insurance Remittances]
      summary: List manually recorded insurer remittance advice
      description: Requires insurance_remittances.view and patients.view. Paginated clinic-scoped staff observations; these records do not represent insurer-verified settlement or cash receipt.
      parameters:
        - { name: insurer_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: advice_date_from, in: query, schema: { type: string, format: date } }
        - { name: advice_date_to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { description: Standard envelope with a paginated advice array and meta.pagination; private/no-store. }
        '401': { $ref: "#/components/responses/Unauthenticated" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '422': { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Insurance Remittances]
      summary: Record manual insurer remittance advice
      description: Requires insurance_remittances.record, patients.view and active clinic membership. Staff-entered observation only; supplied amounts remain informational and do not post payments, modify invoices or balances, reconcile receivables, or recognize cash. An Idempotency-Key must be a UUID.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid, example: e9a92467-981a-46db-a6fe-d9bc0e9bc215 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceRemittanceAdviceInput' }
      responses:
        '201': { description: Immutable advice observation and its line items recorded. }
        '200': { description: Identical idempotent replay. }
        '401': { $ref: "#/components/responses/Unauthenticated" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '409': { description: Duplicate insurer reference or idempotency key reused with different data. }
        '422': { $ref: "#/components/responses/ValidationError" }
  /api/insurance/remittances/{advice}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: advice, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Insurance Remittances]
      summary: Retrieve manually recorded insurer remittance advice
      description: Requires insurance_remittances.view and patients.view. Returns an immutable staff observation in the active clinic only.
      responses:
        '200': { description: Standard envelope containing advice metadata and reported totals. }
        '401': { $ref: "#/components/responses/Unauthenticated" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
  /api/insurance/remittances/{advice}/lines:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: advice, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Insurance Remittances]
      summary: List remittance advice line items
      description: Requires insurance_remittances.view and patients.view. Lines retain explicit nulls when a reported amount is unknown; pagination is clinic-scoped.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Standard envelope with paginated line items and meta.pagination; private/no-store. }
        '401': { $ref: "#/components/responses/Unauthenticated" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
  /api/insurance/remittances/{advice}/corrections:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: advice, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Insurance Remittances]
      summary: Record a linked correction to remittance advice
      description: Requires insurance_remittances.correct, patients.view and active clinic membership. Creates a new immutable advice record linked to the original, retaining insurer and currency; no insurer-issued identifier is generated.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid, example: e9a92467-981a-46db-a6fe-d9bc0e9bc216 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsuranceRemittanceCorrectionInput' }
      responses:
        '201': { description: New immutable correction linked to the original advice. }
        '200': { description: Identical idempotent replay. }
        '401': { $ref: "#/components/responses/Unauthenticated" }
        '403': { $ref: "#/components/responses/Forbidden" }
        '404': { $ref: "#/components/responses/NotFound" }
        '409': { description: Advice already has a correction or idempotency key conflicts. }
        '422': { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/treatment-plans:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Treatment Plans]
      summary: List patient treatment plans
      description: Clinical role or treatment_plans.view required. Newest first with items sorted by sequence then ID. Archived patients remain readable. See docs/treatment-planning.md.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, completed, cancelled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        "200":
          description: Standard envelope with data as a plan array and meta.pagination. Private/no-store.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/TreatmentPlan" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Treatment Plans]
      summary: Create a draft treatment plan
      description: Admin or Dentist required; Dentist plus Receptionist denied unless Admin. Permission wildcards cannot grant clinical writes. Optional initial items and all audits commit atomically. Archived patients are read-only. Ownership and item snapshot values are server-controlled.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateTreatmentPlan" } } }
      responses:
        "201": { $ref: "#/components/responses/TreatmentPlanEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/treatment-plans/{treatment_plan}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/TreatmentPlanId"
    get:
      tags: [Treatment Plans]
      summary: Get a treatment plan and its items
      responses:
        "200": { $ref: "#/components/responses/TreatmentPlanEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Treatment Plans]
      summary: Update a treatment plan
      description: Clinical writes only. Draft may become active or cancelled; active may become completed or cancelled. Activation requires a proposed item. Completion requires at least one completed item and no unfinished items. Cancellation cancels unfinished items atomically. Completed/cancelled plans and archived patients are read-only. No destructive delete endpoint.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTreatmentPlan" } } }
      responses:
        "200": { $ref: "#/components/responses/TreatmentPlanEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Treatment Plans]
      summary: Update a treatment plan (partial PUT)
      description: Same partial update and lifecycle rules as PATCH. Clinical role required.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTreatmentPlan" } } }
      responses:
        "200": { $ref: "#/components/responses/TreatmentPlanEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/treatment-plans/{treatment_plan}/items:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/TreatmentPlanId"
    post:
      tags: [Treatment Plans]
      summary: Add a proposed procedure
      description: Clinical role required. Plan must be draft/active with an unarchived patient. Catalog treatment must be active and all references clinic-local. Captures immutable catalog price and procedure name; estimate defaults to that price. Omitted sequence appends after the current maximum.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateTreatmentPlanItem" } } }
      responses:
        "201": { $ref: "#/components/responses/TreatmentPlanItemEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/treatment-plans/{treatment_plan}/items/{item}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/TreatmentPlanId"
      - { name: item, in: path, required: true, schema: { type: integer, example: 1 } }
    patch:
      tags: [Treatment Plans]
      summary: Update a proposed or in-progress item
      description: Clinical role required. Proposed items can progress, complete or cancel; in-progress items can complete or cancel. Progress/completion requires an active plan. Terminal items/plans are read-only. Context updates replace the whole context; null clears it. Treatment identity, catalog_price and treatment_name are immutable. Wrong-parent items return 404.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTreatmentPlanItem" } } }
      responses:
        "200": { $ref: "#/components/responses/TreatmentPlanItemEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Treatment Plans]
      summary: Update an item (partial PUT)
      description: Same partial update and lifecycle rules as PATCH. Clinical role required.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTreatmentPlanItem" } } }
      responses:
        "200": { $ref: "#/components/responses/TreatmentPlanItemEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/dental-chart/metadata:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/ChartNumbering"
    get:
      tags: [Dental Charts]
      summary: Get tooth numbering and chart vocabulary
      description: Clinical chart read authorization required. Returns adult/primary tooth positions, allowed surfaces, F/P aliases, presence/finding statuses and extensible condition suggestions. Universal is the product default (adult 1-32, primary A-T); FDI can be requested explicitly. See docs/dental-charting.md.
      responses:
        "200":
          description: Standard envelope with data.numbering_system, numbering_systems, dentitions.adult (32 positions), dentitions.primary (20 positions), tooth_statuses, finding_statuses, surfaces, surface_aliases, suggested_conditions and custom_condition_codes. Each position includes tooth, canonical fdi and five allowed surface codes.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/dental-chart:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/ChartDentition"
      - $ref: "#/components/parameters/ChartNumbering"
    get:
      tags: [Dental Charts]
      summary: Read the current patient dental chart
      description: Requires clinical role or dental_charts.view. Empty charts return version 0 and teeth [] without creating records. Adult/primary charts are independent. Archived patient charts remain readable. Foreign patients return 404. Responses are private/no-store.
      responses:
        "200": { $ref: "#/components/responses/DentalChartEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/dental-chart/revisions:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    post:
      tags: [Dental Charts]
      summary: Append a complete dental chart snapshot
      description: Admin or Dentist clinical role required; Receptionist plus Dentist is denied unless Admin is also present. Permission wildcards do not bypass clinical writes. expected_version is mandatory (0 for the first revision); stale writes return 409 without changing history or audits. This is a full snapshot, including deliberate omissions/empty lists, not a patch. The server assigns ownership, version, actor and UTC timestamp. Clinical-note links must match patient and provider; treatment links must be clinic-local. Exactly one metadata-only dental_charts/revision_created audit is committed atomically. Existing revisions cannot be updated/deleted. Archived patients are read-only. See docs/dental-charting.md.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DentalChartRevisionRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/DentalChartEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stale expected_version. Reload and reconcile before retrying. Standard error envelope with code CONFLICT; no writes or audits.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorEnvelope" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/dental-chart/history:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/ChartDentition"
      - $ref: "#/components/parameters/ChartNumbering"
    get:
      tags: [Dental Charts]
      summary: List immutable dental chart revision summaries
      description: Same clinical read authorization and tenant boundary as current chart. Newest-first summaries omit teeth; fetch an exact version for its full snapshot. Private/no-store.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Standard envelope with data.revisions and meta.pagination (currentPage, perPage, total, lastPage, from, to, hasMorePages).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revisions: { type: array, items: { $ref: "#/components/schemas/DentalChartRevisionSummary" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/dental-chart/revisions/{version}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/ChartDentition"
      - $ref: "#/components/parameters/ChartNumbering"
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Dental Charts]
      summary: Read an exact historical dental chart version
      description: Same clinical read authorization and tenant boundary as current chart. The version belongs to the selected patient and dentition; it is not a global revision ID. Numbering conversion changes only the response projection. Private/no-store.
      responses:
        "200": { $ref: "#/components/responses/DentalChartEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/tenants:
    get:
      tags: [Tenants]
      summary: List current user's active clinic memberships
      description: Requires Sanctum authentication but not a selected clinic. Returns only the caller's active memberships, enabling clinic discovery before X-Tenant-Id selection. Does not create clinics, enroll users, or confer platform privileges. Changing clinic requires refetching current-user roles/permissions and clearing clinic-specific frontend state. Unsupported tenant IDs return 403 on clinic endpoints; malformed IDs return 422. Foreign resource IDs return 404.
      responses:
        "200":
          description: Standard envelope with data.tenants ordered by ID.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tenants:
                            type: array
                            items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /sanctum/csrf-cookie:
    get:
      tags: [Auth]
      summary: Initialize CSRF and session cookies for browser clients
      description: Browser clients should call this endpoint with credentials enabled before posting to /login or /register.
      security: []
      responses:
        "200":
          description: CSRF and session cookies were queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { nullable: true, example: null }
  /login:
    post:
      tags: [Auth]
      summary: Log in with a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User authenticated and session regenerated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "409":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /register:
    post:
      tags: [Auth]
      summary: Register and log in with a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created, authenticated, and session regenerated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "409":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /logout:
    post:
      tags: [Auth]
      summary: Log out of the current browser session
      security:
        - sanctumCookie: []
      responses:
        "200":
          description: User logged out and session invalidated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HealthResponse" }
  /api/user:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Users]
      summary: Get authenticated user
      description: Requires active membership in the selected clinic. Returns current_tenant_id, clinic-local roles, and flattened clinic-local permission slugs. Refetch after clinic changes. X-Tenant-Id is returned as a response header on successful clinic requests. Headers and payload fields never grant membership or platform privileges.
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/token:
    post:
      tags: [Users]
      summary: Create a Sanctum bearer token
      description: Use this for Swagger UI testing. The Next.js frontend can continue using the cookie-based Sanctum flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  example: password
                token_name:
                  type: string
                  nullable: true
                  example: swagger
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  statusCode: { type: integer, example: 201 }
                  message: { type: string, example: Token created. }
                  code: { type: string, nullable: true, example: null }
                  data:
                    type: object
                    properties:
                      token_type: { type: string, example: Bearer }
                      access_token: { type: string, example: 1|example-token-value }
                  errors: { type: object, nullable: true, example: null }
                  meta: { type: object, nullable: true, example: null }
                  requestId: { type: string, nullable: true, example: 018fe4f3-8b34-7cc9-9f3f-b37a2d5f7c6e }
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Users]
      summary: Revoke the current Sanctum bearer token
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/dashboard/summary:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Dashboard]
      summary: Get overview dashboard metrics
      responses:
        "200":
          description: Dashboard summary.
          content:
            application/json:
              schema:
