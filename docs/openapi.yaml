    ClinicalNoteEnvelope:
      description: Clinical note envelope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      clinicalNote: { $ref: "#/components/schemas/ClinicalNote" }
  schemas:
    InventoryItemInput:
      type: object
      required: [sku, name, base_unit]
      additionalProperties: false
      properties:
        sku: { type: string, pattern: '^[A-Z0-9][A-Z0-9._-]{0,63}$', example: GLOVES-M }
        name: { type: string, minLength: 1, maxLength: 160, example: Medium gloves }
        base_unit: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$', example: each }
    InventoryLocationInput:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9._-]{0,63}$', example: STOCKROOM }
        name: { type: string, minLength: 1, maxLength: 160, example: Stockroom }
    InventoryLotInput:
      type: object
      required: [item_id, code]
      additionalProperties: false
      properties:
        item_id: { type: integer, minimum: 1, example: 1 }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9._-]{0,63}$', example: LOT-01 }
        expires_on: { type: string, format: date, nullable: true, example: "2028-05-31" }
    InventoryMovementInput:
      type: object
      required: [item_id, location_id, kind, quantity_delta, reason]
      additionalProperties: false
      properties:
        item_id: { type: integer, minimum: 1, example: 1 }
        location_id: { type: integer, minimum: 1, example: 1 }
        lot_id: { type: integer, minimum: 1, nullable: true }
        kind: { type: string, enum: [receipt, issue, adjustment], example: receipt }
        quantity_delta:
          type: string
          pattern: '^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
          description: Positive for receipts, negative for issues and either nonzero sign for adjustments. Use the fixed base unit.
          example: "12.125"
        reason: { type: string, minLength: 1, maxLength: 500, example: Manual opening count }
    InventoryCorrectionInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, example: Reversing duplicate physical receipt }
    InventoryItem:
      type: object
      required: [id, sku, name, base_unit]
      properties:
        id: { type: integer, minimum: 1 }
        sku: { type: string }
        name: { type: string }
        base_unit: { type: string }
    InventoryLocation:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, minimum: 1 }
        code: { type: string }
        name: { type: string }
    InventoryLot:
      type: object
      required: [id, item_id, code, expires_on]
      properties:
        id: { type: integer, minimum: 1 }
        item_id: { type: integer, minimum: 1 }
        code: { type: string }
        expires_on: { type: string, format: date, nullable: true }
    InventoryMovement:
      type: object
      required: [id, item_id, location_id, lot_id, kind, quantity_delta, reason, corrects_movement_id, recorded_by_user_id, recorded_at]
      properties:
        id: { type: integer, minimum: 1 }
        item_id: { type: integer, minimum: 1 }
        location_id: { type: integer, minimum: 1 }
        lot_id: { type: integer, minimum: 1, nullable: true }
        kind: { type: string, enum: [receipt, issue, adjustment, correction] }
        quantity_delta: { type: string, example: "-0.125000" }
        reason: { type: string }
        corrects_movement_id: { type: integer, minimum: 1, nullable: true }
        recorded_by_user_id: { type: integer, minimum: 1 }
        recorded_at: { type: string, format: date-time }
    InventoryMovementResult:
      type: object
      required: [movement, replayed]
      properties:
        movement: { $ref: "#/components/schemas/InventoryMovement" }
        replayed: { type: boolean }
    InventoryBalance:
      type: object
      required: [item_id, location_id, lot_id, quantity]
      properties:
        item_id: { type: integer, minimum: 1 }
        location_id: { type: integer, minimum: 1 }
        lot_id: { type: integer, minimum: 1, nullable: true }
        quantity: { type: string, example: "12.125000" }
    GovernanceReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 2000, example: Clinic-authorized operational review. }
    GovernanceTargetRequest:
      allOf:
        - { $ref: "#/components/schemas/GovernanceReasonRequest" }
        - type: object
          required: [user_id]
          properties:
            user_id: { type: integer, description: Explicit permitted staff target within the current clinic. }
    InsurerObligationProposalInput:
      type: object
      additionalProperties: false
      required: [insurer_id, association_id, invoice_id, invoice_item_id, proposed_amount, currency, source_provenance]
      properties:
        insurer_id: { type: integer, minimum: 1 }
        association_id: { type: integer, minimum: 1 }
        invoice_id: { type: integer, minimum: 1, description: Must identify an issued invoice belonging to the selected patient and tenant. }
        invoice_item_id: { type: integer, minimum: 1, description: Must identify a line on the invoice. Proposed obligation cannot exceed that line's charge. }
        claim_id: { type: integer, nullable: true }
        submission_id: { type: integer, nullable: true }
        claim_response_id: { type: integer, nullable: true, description: Optional approved or partially approved response for context only; amount is entered independently. }
        supporting_evidence_id: { type: integer, nullable: true }
        proposed_amount: { type: string, pattern: '^(?:0|[1-9][0-9]{0,7})(?:\.[0-9]{1,2})?$', example: '125.00' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: 'JMD' }
        source_provenance: { type: string, minLength: 1, maxLength: 2000, description: Staff-recorded basis for the proposal; it does not assert direct insurer verification. }
    PriorAuthorizationCreateInput:
      type: object
      additionalProperties: false
      required: [association_id, request_date, treatment_description, requested_amount, currency]
      properties:
        association_id: { type: integer, minimum: 1 }
        policy_revision_id: { type: integer, nullable: true, minimum: 1 }
        claim_id: { type: integer, nullable: true, minimum: 1 }
        treatment_plan_item_id: { type: integer, nullable: true, minimum: 1 }
        estimate_id: { type: integer, nullable: true, minimum: 1 }
        request_date: { type: string, format: date }
        treatment_description: { type: string, minLength: 1, maxLength: 4000 }
        procedure_details: { type: object, additionalProperties: true }
        requested_amount: { type: string, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    PriorAuthorizationUpdateInput:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        policy_revision_id: { type: integer, nullable: true, minimum: 1 }
        claim_id: { type: integer, nullable: true, minimum: 1 }
        treatment_plan_item_id: { type: integer, nullable: true, minimum: 1 }
        estimate_id: { type: integer, nullable: true, minimum: 1 }
        request_date: { type: string, format: date }
        treatment_description: { type: string, minLength: 1, maxLength: 4000 }
        procedure_details: { type: object, additionalProperties: true }
        requested_amount: { type: string, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    PriorAuthorizationRequestInput:
      type: object
      additionalProperties: false
      required: [expected_version, communication_channel, source_provenance]
      properties:
        expected_version: { type: integer, minimum: 1 }
        communication_channel: { type: string, enum: [phone, portal, email, fax, paper, other] }
        source_provenance: { type: string, minLength: 1, maxLength: 2000, description: Clinic staff recorded request source; not proof of insurer receipt. }
    PriorAuthorizationDecisionInput:
      type: object
      additionalProperties: false
      required: [expected_version, decision_type, communication_channel, decision_at, source_provenance]
      properties:
        expected_version: { type: integer, minimum: 1 }
        decision_type: { type: string, enum: [acknowledged, approved, partially_approved, denied, additional_information_requested] }
        insurer_reference: { type: string, nullable: true, maxLength: 200, writeOnly: true }
        authorized_amount: { type: string, nullable: true, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$' }
        currency: { type: string, nullable: true, pattern: '^[A-Z]{3}$' }
        authorized_scope: { type: string, nullable: true, maxLength: 4000 }
        valid_from: { type: string, format: date, nullable: true }
        valid_through: { type: string, format: date, nullable: true }
        communication_channel: { type: string, enum: [phone, portal, email, fax, paper, other] }
        decision_at: { type: string, format: date-time }
        source_provenance: { type: string, minLength: 1, maxLength: 2000 }
        corrects_decision_id: { type: integer, minimum: 1, description: Optional latest decision to correct; prior decision remains immutable. }
        correction_reason: { type: string, minLength: 1, maxLength: 2000 }
    PriorAuthorizationEvidenceInput:
      type: object
      additionalProperties: false
      required: [document_id, target_type, target_id, command_key]
      properties:
        document_id: { type: integer, minimum: 1 }
        target_type: { type: string, enum: [authorization, decision, claim, submission] }
        target_id: { type: integer, minimum: 1 }
        command_key: { type: string, format: uuid }
    InsuranceClaimDraftInput:
      type: object
      additionalProperties: false
      required: [association_id]
      properties:
        association_id: { type: integer, minimum: 1, example: 42 }
        policy_revision_id: { type: integer, nullable: true, minimum: 1, example: 9 }
        estimate_id: { type: integer, nullable: true, minimum: 1, example: 18 }
        corrects_claim_id: { type: integer, nullable: true, minimum: 1, example: 12, description: Link a correction to a prior submitted claim. }
    ExpectedClaimVersion:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1, example: 1 }
    InsuranceClaimUpdateInput:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1, example: 2 }
        policy_revision_id: { type: integer, nullable: true, minimum: 1, example: 9 }
        estimate_id: { type: integer, nullable: true, minimum: 1, example: 18 }
    InsuranceClaimLineInput:
      type: object
      additionalProperties: false
      required: [expected_version, treatment_description, service_date, quantity, unit_amount, currency]
      properties:
        expected_version: { type: integer, minimum: 1, example: 1 }
        treatment_plan_item_id: { type: integer, nullable: true, minimum: 1, example: 55 }
        treatment_description: { type: string, minLength: 1, maxLength: 1000, example: Synthetic examination }
        procedure_code: { type: string, nullable: true, maxLength: 100, example: SYN-001 }
        code_system: { type: string, nullable: true, maxLength: 100, example: Synthetic }
        service_date: { type: string, format: date, example: '2031-04-02' }
        quantity: { type: integer, minimum: 1, maximum: 10000, example: 2 }
        unit_amount: { type: string, pattern: '^(0|[1-9][0-9]{0,7})(\\.[0-9]{1,2})?$', example: '25.25' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: JMD }
    InsuranceClaimCancelInput:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1, example: 2 }
        reason: { type: string, minLength: 3, maxLength: 500, example: Synthetic cancellation }
    InsuranceClaimSubmitInput:
      type: object
      additionalProperties: false
      required: [expected_version, channel]
      properties:
        expected_version: { type: integer, minimum: 1, example: 3 }
        channel: { type: string, enum: [portal, email, paper, other], example: paper }
        channel_metadata:
          type: object
          additionalProperties: false
          properties:
            method_note: { type: string, maxLength: 500, example: Synthetic staff-recorded note }
    CommunicationConsentRequest:
      type: object
      required: [purpose, scope, channel, status, source, text_version, acknowledged_text, evidence]
      description: 'Valid purpose/scope pairs: transactional with appointments/billing/payment_receipts; clinical with follow_up; general with non_essential. Captured_by, captured_at and version are server-controlled. Record actual patient consent independently of staff send confirmation.'
      properties:
        purpose: { type: string, enum: [transactional, clinical, general], example: clinical }
        scope: { type: string, enum: [appointments, billing, payment_receipts, follow_up, non_essential], example: follow_up }
        channel: { type: string, enum: [in_app, email, sms], example: in_app }
        status: { type: string, enum: [granted, declined, withdrawn, revoked], example: declined }
        source: { type: string, enum: [in_person, written_form, phone, patient_request], example: written_form }
        text_version: { type: string, maxLength: 100, example: care-policy-v2 }
        acknowledged_text: { type: string, maxLength: 10000, example: I decline in-app clinical follow-up messages. }
        evidence: { type: string, maxLength: 2000, example: Signed patient form REF-23. }
    ConversationSendRequest:
      type: object
      required: [idempotency_key]
      anyOf:
        - required: [body]
        - required: [kind, supersedes_id, reason]
      description: For redaction omit body and require supersedes_id and reason. Correction requires body, supersedes_id and reason. Only the original sender can correct/redact their message. Patient sends additionally require confirmation_token and both acknowledgement flags true; preparing a confirmation needs none of those three fields.
      properties:
        body: { type: string, maxLength: 10000, example: Please review your care instructions. }
        idempotency_key: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$', example: unique-send-key }
        kind: { type: string, enum: [message, correction, redaction], default: message }
        supersedes_id: { type: integer }
        reason: { type: string, maxLength: 1000 }
        channel: { type: string, enum: [in_app] }
        confirmation_token: { type: string, minLength: 64, maxLength: 64 }
        send_confirmed: { type: boolean }
        consent_acknowledged: { type: boolean }
    ReportStatusCounts:
      type: object
      required: [scheduled, checked_in, in_progress, completed, cancelled, no_show]
      properties:
        scheduled: { type: integer, minimum: 0 }
        checked_in: { type: integer, minimum: 0 }
        in_progress: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        no_show: { type: integer, minimum: 0 }
    AppointmentReport:
      type: object
      required: [appointment_count, by_status, by_date]
      properties:
        appointment_count: { type: integer, minimum: 0 }
        by_status: { $ref: "#/components/schemas/ReportStatusCounts" }
        by_date:
          type: array
          maxItems: 366
          items:
            type: object
            required: [date, appointment_count, by_status]
            properties:
              date: { type: string, format: date }
              appointment_count: { type: integer, minimum: 0 }
              by_status: { $ref: "#/components/schemas/ReportStatusCounts" }
    ProviderReport:
      type: object
      required: [dentist_id, appointment_count, by_status, booked_minutes, completed_minutes, available_minutes, occupied_minutes, utilization_percent]
      properties:
        dentist_id: { type: integer }
        appointment_count: { type: integer, minimum: 0 }
        by_status: { $ref: "#/components/schemas/ReportStatusCounts" }
        booked_minutes: { type: integer, minimum: 0 }
        completed_minutes: { type: integer, minimum: 0 }
        available_minutes: { type: number, nullable: true, minimum: 0 }
        occupied_minutes: { type: number, nullable: true, minimum: 0 }
        utilization_percent: { type: number, nullable: true, minimum: 0, maximum: 100 }
    BillingReportCurrency:
      type: object
      required: [currency, invoice_count, invoiced_total, paid_total, outstanding_balance, payment_count, collections_total]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        invoice_count: { type: integer, minimum: 0 }
        invoiced_total: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: "100.10" }
        paid_total: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: "25.00" }
        outstanding_balance: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: "75.10" }
        payment_count: { type: integer, minimum: 0 }
        collections_total: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: "25.00" }
    InsuranceReportSummary:
      type: object
      required: [recorded_window, eligibility_checks, benefit_rules, estimates, claims, appeals, prior_authorizations, remittance_advice, insurer_receipts, insurer_obligations]
      properties:
        recorded_window:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        eligibility_checks: { $ref: "#/components/schemas/InsuranceReportOutcomeCounts" }
        benefit_rules: { $ref: "#/components/schemas/InsuranceReportSourceCounts" }
        estimates: { $ref: "#/components/schemas/InsuranceReportLifecycleCounts" }
        claims: { $ref: "#/components/schemas/InsuranceReportLifecycleCounts" }
        appeals: { $ref: "#/components/schemas/InsuranceReportLifecycleCounts" }
        prior_authorizations: { $ref: "#/components/schemas/InsuranceReportLifecycleCounts" }
        remittance_advice:
          type: object
          required: [recorded_count]
          properties:
            recorded_count: { type: integer, minimum: 0 }
        insurer_receipts:
          type: object
          required: [recorded_count, verified_count, unverified_count]
          properties:
            recorded_count: { type: integer, minimum: 0 }
            verified_count: { type: integer, minimum: 0 }
            unverified_count: { type: integer, minimum: 0 }
        insurer_obligations:
          type: object
