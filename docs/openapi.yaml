        lastName: { type: string, example: Doe }
        appointments: { type: string, example: Cleaning }
        streetAddress: { type: string, example: 123 Main Street }
        town: { type: string, example: Midtown }
        city: { type: string, example: Bogota }
        sex: { type: string, example: Female }
        notes: { type: string, example: Prefers morning appointments. }
        emergency_contact_name: { type: string, nullable: true, example: Luis Garcia }
        emergency_contact_phone: { type: string, nullable: true, example: "+5715551234" }
        emergency_contact_relationship: { type: string, nullable: true, example: Spouse }
        allergies:
