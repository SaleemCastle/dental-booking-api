    DentalChartFinding:
      type: object
      additionalProperties: false
      required: [code, status, surfaces]
      properties:
        code: { type: string, maxLength: 50, pattern: '^[a-z][a-z0-9_]*$', example: caries }
        status: { type: string, enum: [active, resolved] }
        surfaces:
          type: array
          maxItems: 5
          uniqueItems: true
          description: Empty means whole tooth. F/P are input aliases for B/L. I is valid only on anterior positions; O only on posterior positions. Responses always use normalized B/L.
