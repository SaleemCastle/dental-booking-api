  /api/users:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Users]
      summary: List users
      responses:
        "200":
          description: User list.
    post:
      tags: [Users]
      summary: Create user
      responses:
        "201":
          description: User created.
  /api/users/{user}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get user
      responses:
        "200":
          description: User details.
    patch:
      tags: [Users]
      summary: Update user
      responses:
        "200":
          description: User updated.
    put:
      tags: [Users]
      summary: Update user
      responses:
        "200":
          description: User updated.
    delete:
      tags: [Users]
      summary: Delete user
      description: Removes the user from the selected clinic. Shared identities retain their global account, other clinic memberships and roles, and append users/membership_removed in this clinic. A single-clinic identity retains the Phase 1 account-deletion behavior. Clinic membership and tenant-local target binding are required; no platform authority is implied.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/roles:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Roles]
      summary: List roles with permissions
      description: Requires the actual admin role, including for reads. Permission wildcards alone do not grant access. Ordered by ID. See docs/roles.md and docs/audit-logging.md.
      responses:
        "200": { $ref: "#/components/responses/RoleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Roles]
      summary: Create a custom role
      description: Admin only. is_system is server-controlled and rejected in input, including null. Creation atomically appends a roles/created audit record without copying description or permission snapshots.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleCreateRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: role, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Roles]
      summary: Get role with permissions
      description: Admin only.
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Roles]
      summary: Partially update a role
      description: Admin only. Omitted fields are preserved. System-role slugs cannot change; is_system is prohibited. Changed writes atomically append roles/updated; no-op writes do not append records.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleUpdateRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Roles]
      summary: Update a role
      description: Same partial-update, admin-only authorization, protected system-role rules, and atomic audit behavior as PATCH.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleUpdateRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Roles]
      summary: Delete a custom role
      description: Admin only. System roles cannot be deleted. Removes role memberships and permission links atomically with a roles/deleted audit and users/roles_changed audits for affected users. Existing audit history is retained.
      responses:
        "200": { $ref: "#/components/responses/DeleteMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/permissions:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Roles]
      summary: List existing permissions for role assignment
      description: Admin-only selector ordered by slug. Does not create permission definitions or emit mutation audits.
      responses:
        "200": { $ref: "#/components/responses/PermissionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/roles/{role}/permissions:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: role, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Roles]
      summary: Replace a role's permissions
      description: Admin only. Empty array removes all permissions. Same assignments are a no-op. Changes append roles/permissions_changed atomically; descriptions and permission snapshots are not copied into audit storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids: { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/users/{user}/roles:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Roles]
      summary: Replace a user's assigned roles
      description: Admin only. Empty array removes all roles, including the caller's own admin role if the caller is the target. Same assignments are a no-op. Changes append users/roles_changed with the performing admin as actor and edited user as resource. See docs/roles.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids: { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Standard envelope with data.user including assigned roles and flattened permissions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { type: object, properties: { user: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/audit-logs:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Audit Logs]
      summary: List read-only audit history
      description: Requires the actual admin or auditor role slug; permission wildcards and audit_logs.view alone do not grant access. All supplied filters combine with AND. Ordered by occurred_at descending then ID descending. Deleted resource/user IDs remain queryable. Returns private, no-store data. Reads do not emit audit events. See docs/audit-log-frontend-guide.md.
      parameters:
        - name: actor_id
          in: query
          description: Filter by the performing user's ID, including deleted users. Incompatible with actor_is_null=1.
          schema: { type: integer, minimum: 1 }
        - name: actor_is_null
          in: query
          description: Use 1 for unattributed/system/unauthenticated actors or 0 for attributed actors; omit for both.
          schema: { type: integer, enum: [0, 1] }
        - name: action
          in: query
          schema: { type: string, maxLength: 80, pattern: '^[a-z][a-z0-9_.]*$' }
        - name: resource_type
          in: query
          schema: { type: string, maxLength: 80, pattern: '^[a-z][a-z0-9_]*$' }
        - name: resource_id
          in: query
          description: Exact canonical string key; combine with resource_type for one resource's history.
          schema: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        - name: request_id
          in: query
          description: Originating mutation request ID, not the current GET request ID.
          schema: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
        - name: from
          in: query
          description: Inclusive occurrence-time lower bound. Requires seconds and explicit timezone; optional 1-6 fractional digits. Normalized to UTC.
          schema: { type: string, format: date-time, example: '2026-10-18T00:00:00-05:00' }
        - name: to
          in: query
          description: Inclusive upper bound with explicit timezone, on/after from. Microsecond precision is supported.
          schema: { type: string, format: date-time, example: '2026-10-18T23:59:59.999999-05:00' }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200": { $ref: "#/components/responses/AuditLogList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/audit-logs/filters:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Audit Logs]
      summary: Get available audit filter options
      description: Admin/auditor only. Sorted unique actions and resource types found in stored history; not restricted by active list filters and not a fixed catalog. Empty history returns empty arrays. Response is private, no-store.
      responses:
        "200": { $ref: "#/components/responses/AuditLogFilters" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/audit-logs/{audit_log}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: audit_log, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Audit Logs]
      summary: Get an audit record
      description: Admin/auditor only. Same safe row shape as the list, including nullable current actorName rather than a full user model. Does not require that the actor or resource still exist. Response is private, no-store. POST/PUT/PATCH/DELETE audit routes are not exposed.
      responses:
        "200": { $ref: "#/components/responses/AuditLogEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel_session
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: Select an active clinic membership. Omit for default-clinic. Does not confer membership or bypass authorization.
      schema: { type: integer, minimum: 1 }
    AppointmentId: { name: appointment, in: path, required: true, schema: { type: integer, example: 1 } }
    ClinicalNoteId: { name: clinical_note, in: path, required: true, schema: { type: integer, example: 1 } }
