openapi: 3.0.3
info:
  title: Dental Booking Backend API
  version: 1.2.0
  description: Laravel Sanctum API for dental clinic booking, scheduling, billing, messaging, and dashboard workflows. All JSON endpoints return the standard ApiEnvelope shape with success, statusCode, message, code, data, errors, meta, and requestId.
servers:
  - url: http://localhost:8000
    description: Local Laravel server
security:
  - sanctumBearer: []
tags:
  - name: Auth
  - name: Health
  - name: Dashboard
  - name: Patients
  - name: Appointments
  - name: Dentists
  - name: Treatments
  - name: Invoices
  - name: Payments
  - name: Clinical Notes
  - name: Messages
  - name: Referrals
  - name: Users
paths:
  /sanctum/csrf-cookie:
    get:
      tags: [Auth]
      summary: Initialize CSRF and session cookies for browser clients
      description: Browser clients should call this endpoint with credentials enabled before posting to /login or /register.
      security: []
      responses:
        "200":
          description: CSRF and session cookies were queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { nullable: true, example: null }
  /login:
    post:
      tags: [Auth]
      summary: Log in with a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User authenticated and session regenerated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "409":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /register:
    post:
      tags: [Auth]
      summary: Register and log in with a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created, authenticated, and session regenerated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "409":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /logout:
    post:
      tags: [Auth]
      summary: Log out of the current browser session
      security:
        - sanctumCookie: []
      responses:
        "200":
          description: User logged out and session invalidated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HealthResponse" }
  /api/user:
    get:
      tags: [Users]
      summary: Get authenticated user
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/token:
    post:
      tags: [Users]
      summary: Create a Sanctum bearer token
      description: Use this for Swagger UI testing. The Next.js frontend can continue using the cookie-based Sanctum flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  example: password
                token_name:
                  type: string
                  nullable: true
                  example: swagger
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  statusCode: { type: integer, example: 201 }
                  message: { type: string, example: Token created. }
                  code: { type: string, nullable: true, example: null }
                  data:
                    type: object
                    properties:
                      token_type: { type: string, example: Bearer }
                      access_token: { type: string, example: 1|example-token-value }
                  errors: { type: object, nullable: true, example: null }
                  meta: { type: object, nullable: true, example: null }
                  requestId: { type: string, nullable: true, example: 018fe4f3-8b34-7cc9-9f3f-b37a2d5f7c6e }
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Users]
      summary: Revoke the current Sanctum bearer token
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get overview dashboard metrics
      responses:
        "200":
          description: Dashboard summary.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummary" }
  /api/patients:
    get:
      tags: [Patients]
      summary: List patients
      responses:
        "200":
          description: Patient list in the current frontend shape.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          patients:
                            type: array
                            items:
                              $ref: "#/components/schemas/Patient"
    post:
      tags: [Patients]
      summary: Create patient
      requestBody:
        $ref: "#/components/requestBodies/PatientBody"
      responses:
        "201":
          description: Created patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/patients/{patient}:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Patients]
      summary: Get patient
      responses:
        "200":
          description: Patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Patients]
      summary: Update patient
      requestBody:
        $ref: "#/components/requestBodies/PatientUpdateBody"
      responses:
        "200":
          description: Updated patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Patients]
      summary: Update patient
      requestBody:
        $ref: "#/components/requestBodies/PatientUpdateBody"
      responses:
        "200":
          description: Updated patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Patients]
      summary: Delete patient
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/patients/{patient}/update:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    put:
      tags: [Patients]
      summary: Legacy patient update endpoint
      deprecated: true
      requestBody:
        $ref: "#/components/requestBodies/PatientUpdateBody"
      responses:
        "200":
          description: Updated patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
  /api/patients/{patient}/delete:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    delete:
      tags: [Patients]
      summary: Legacy patient delete endpoint
      deprecated: true
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-10-05"
      responses:
        "200":
          description: Appointment list with display-ready fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          appointments:
                            type: array
                            items:
                              $ref: "#/components/schemas/Appointment"
    post:
      tags: [Appointments]
      summary: Create appointment
      description: Accepts snake_case fields and frontend camelCase aliases such as startsAt, patientId, dentistId, treatmentId, durationMinutes, and appointmentType.
      requestBody:
        $ref: "#/components/requestBodies/AppointmentBody"
      responses:
        "201":
          description: Appointment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    get:
      tags: [Appointments]
      summary: Get appointment
      responses:
        "200":
          description: Appointment details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
    patch:
      tags: [Appointments]
      summary: Update appointment
      requestBody:
        $ref: "#/components/requestBodies/AppointmentUpdateBody"
      responses:
        "200":
          description: Appointment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
    put:
      tags: [Appointments]
      summary: Update appointment
      requestBody:
        $ref: "#/components/requestBodies/AppointmentUpdateBody"
      responses:
        "200":
          description: Appointment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
    delete:
      tags: [Appointments]
      summary: Delete appointment
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/appointments/{appointment}/check-in:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Mark appointment as checked in
      responses:
        "200":
          description: Appointment status changed to checked_in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
  /api/appointments/{appointment}/complete:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Mark appointment as completed
      responses:
        "200":
          description: Appointment status changed to completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
  /api/appointments/{appointment}/cancel:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Cancel appointment
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Patient requested cancellation.
      responses:
        "200":
          description: Appointment status changed to cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
  /api/dentists:
    get:
      tags: [Dentists]
      summary: List dentists
      responses:
        "200":
          $ref: "#/components/responses/DentistList"
    post:
      tags: [Dentists]
      summary: Create dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistBody"
      responses:
        "201":
          $ref: "#/components/responses/DentistEnvelope"
  /api/dentists/{dentist}:
    parameters:
      - $ref: "#/components/parameters/DentistId"
    get:
      tags: [Dentists]
      summary: Get dentist
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    patch:
      tags: [Dentists]
      summary: Update dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    put:
      tags: [Dentists]
      summary: Update dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    delete:
      tags: [Dentists]
      summary: Delete dentist
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/treatments:
    get:
      tags: [Treatments]
      summary: List treatments
      responses:
        "200":
          $ref: "#/components/responses/TreatmentList"
    post:
      tags: [Treatments]
      summary: Create treatment
      requestBody:
        $ref: "#/components/requestBodies/TreatmentBody"
      responses:
        "201":
          $ref: "#/components/responses/TreatmentEnvelope"
  /api/treatments/{treatment}:
    parameters:
      - $ref: "#/components/parameters/TreatmentId"
    get:
      tags: [Treatments]
      summary: Get treatment
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
    patch:
      tags: [Treatments]
      summary: Update treatment
      requestBody:
        $ref: "#/components/requestBodies/TreatmentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
    put:
      tags: [Treatments]
      summary: Update treatment
      requestBody:
        $ref: "#/components/requestBodies/TreatmentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
    delete:
      tags: [Treatments]
      summary: Delete treatment
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      responses:
        "200":
          $ref: "#/components/responses/InvoiceList"
    post:
      tags: [Invoices]
      summary: Create invoice
      requestBody:
        $ref: "#/components/requestBodies/InvoiceBody"
      responses:
        "201":
          $ref: "#/components/responses/InvoiceEnvelope"
  /api/invoices/{invoice}:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      tags: [Invoices]
      summary: Get invoice
      responses:
        "200":
          $ref: "#/components/responses/InvoiceEnvelope"
    patch:
      tags: [Invoices]
      summary: Update invoice
      requestBody:
        $ref: "#/components/requestBodies/InvoiceUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/InvoiceEnvelope"
    put:
      tags: [Invoices]
      summary: Update invoice
      requestBody:
        $ref: "#/components/requestBodies/InvoiceUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/InvoiceEnvelope"
    delete:
      tags: [Invoices]
      summary: Delete invoice
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/payments:
    get:
      tags: [Payments]
      summary: List payments
      responses:
        "200":
          $ref: "#/components/responses/PaymentList"
    post:
      tags: [Payments]
      summary: Create payment
      requestBody:
        $ref: "#/components/requestBodies/PaymentBody"
      responses:
        "201":
          $ref: "#/components/responses/PaymentEnvelope"
  /api/payments/{payment}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [Payments]
      summary: Get payment
      responses:
        "200":
          $ref: "#/components/responses/PaymentEnvelope"
    patch:
      tags: [Payments]
      summary: Update payment
      requestBody:
        $ref: "#/components/requestBodies/PaymentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/PaymentEnvelope"
    put:
      tags: [Payments]
      summary: Update payment
      requestBody:
        $ref: "#/components/requestBodies/PaymentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/PaymentEnvelope"
    delete:
      tags: [Payments]
      summary: Delete payment
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/clinical-notes:
    get:
      tags: [Clinical Notes]
      summary: List clinical notes
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteList"
    post:
      tags: [Clinical Notes]
      summary: Create clinical note
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteBody"
      responses:
        "201":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
  /api/clinical-notes/{clinical_note}:
    parameters:
      - $ref: "#/components/parameters/ClinicalNoteId"
    get:
      tags: [Clinical Notes]
      summary: Get clinical note
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
    patch:
      tags: [Clinical Notes]
      summary: Update clinical note
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
    put:
      tags: [Clinical Notes]
      summary: Update clinical note
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
    delete:
      tags: [Clinical Notes]
      summary: Delete clinical note
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/messages:
    get:
      tags: [Messages]
      summary: List messages
      responses:
        "200":
          description: Message list.
    post:
      tags: [Messages]
      summary: Create message
      responses:
        "201":
          description: Message created.
  /api/messages/{message}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [Messages]
      summary: Get message
      responses:
        "200":
          description: Message details.
    patch:
      tags: [Messages]
      summary: Update message
      responses:
        "200":
          description: Message updated.
    put:
      tags: [Messages]
      summary: Update message
      responses:
        "200":
          description: Message updated.
    delete:
      tags: [Messages]
      summary: Delete message
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/referrals:
    get:
      tags: [Referrals]
      summary: List referrals
      responses:
        "200":
          description: Referral list.
    post:
      tags: [Referrals]
      summary: Create referral
      responses:
        "201":
          description: Referral created.
  /api/referrals/{referral}:
    parameters:
      - $ref: "#/components/parameters/ReferralId"
    get:
      tags: [Referrals]
      summary: Get referral
      responses:
        "200":
          description: Referral details.
    patch:
      tags: [Referrals]
      summary: Update referral
      responses:
        "200":
          description: Referral updated.
    put:
      tags: [Referrals]
      summary: Update referral
      responses:
        "200":
          description: Referral updated.
    delete:
      tags: [Referrals]
      summary: Delete referral
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/users:
    get:
      tags: [Users]
      summary: List users
      responses:
        "200":
          description: User list.
    post:
      tags: [Users]
      summary: Create user
      responses:
        "201":
          description: User created.
  /api/users/{user}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get user
      responses:
        "200":
          description: User details.
    patch:
      tags: [Users]
      summary: Update user
      responses:
        "200":
          description: User updated.
    put:
      tags: [Users]
      summary: Update user
      responses:
        "200":
          description: User updated.
    delete:
      tags: [Users]
      summary: Delete user
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel_session
  parameters:
    AppointmentId: { name: appointment, in: path, required: true, schema: { type: integer, example: 1 } }
    ClinicalNoteId: { name: clinical_note, in: path, required: true, schema: { type: integer, example: 1 } }
    DentistId: { name: dentist, in: path, required: true, schema: { type: integer, example: 1 } }
    InvoiceId: { name: invoice, in: path, required: true, schema: { type: integer, example: 1 } }
    MessageId: { name: message, in: path, required: true, schema: { type: integer, example: 1 } }
    PatientId: { name: patient, in: path, required: true, schema: { type: integer, example: 1 } }
    PaymentId: { name: payment, in: path, required: true, schema: { type: integer, example: 1 } }
    ReferralId: { name: referral, in: path, required: true, schema: { type: integer, example: 1 } }
    TreatmentId: { name: treatment, in: path, required: true, schema: { type: integer, example: 1 } }
    UserId: { name: user, in: path, required: true, schema: { type: integer, example: 1 } }
  requestBodies:
    PatientBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PatientRequest" } } }
    PatientUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PatientUpdateRequest" } } }
    AppointmentBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentRequest" } } }
    AppointmentUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentUpdateRequest" } } }
    DentistBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DentistRequest" } } }
    DentistUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DentistUpdateRequest" } } }
    TreatmentBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/TreatmentRequest" } } }
    TreatmentUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/TreatmentUpdateRequest" } } }
    InvoiceBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceRequest" } } }
    InvoiceUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceUpdateRequest" } } }
    PaymentBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PaymentRequest" } } }
    PaymentUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PaymentUpdateRequest" } } }
    ClinicalNoteBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalNoteRequest" } } }
    ClinicalNoteUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalNoteUpdateRequest" } } }
  responses:
    DeleteMessage:
      description: Resource deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiErrorEnvelope"
              - type: object
                properties:
                  statusCode: { type: integer, example: 401 }
