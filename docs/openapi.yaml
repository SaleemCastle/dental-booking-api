        patient_id: { type: integer, nullable: true }
        appointment_id: { type: integer, nullable: true }
        assignee_id: { type: integer }
        due_date: { type: string, format: date, example: "2026-10-20", description: Exact YYYY-MM-DD calendar date. Past dates are allowed. }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        description: { type: string, minLength: 1, maxLength: 16000 }
    TaskRequest:
      allOf:
        - $ref: "#/components/schemas/TaskFields"
        - type: object
          required: [assignee_id, due_date, description]
    Task:
      type: object
      required: [id, patient_id, appointment_id, assignee_id, due_date, priority, status, description, completed_at, patientName, assigneeName, appointmentStartsAt, is_overdue, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, nullable: true }
        appointment_id: { type: integer, nullable: true }
        assignee_id: { type: integer }
