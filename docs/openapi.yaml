      required: [tooth, status, findings]
      properties:
        tooth:
          description: Position in the explicitly selected system and dentition. Numeric input may be an integer or string; responses use strings. Adult FDI 11-18/21-28/31-38/41-48, primary FDI 51-55/61-65/71-75/81-85, Universal adult 1-32 or primary A-T.
