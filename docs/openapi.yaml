      properties:
        id: { type: integer }
        treatment_plan_id: { type: integer }
        treatment_id: { type: integer }
        treatment_name: { type: string, description: Immutable catalog name captured on addition. }
        dentist_id: { type: integer }
        catalog_price: { type: string, example: "125.50", description: Immutable catalog price captured on addition. }
        estimated_price: { type: string, example: "125.50" }
