          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/InventoryBalance" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel_session
  parameters:
    PaymentLinkId: { name: payment_link, in: path, required: true, schema: { type: integer, example: 1 } }
    ReportDateFrom:
      name: date_from
      in: query
      required: true
      description: Inclusive calendar date in application timezone (UTC). Exact YYYY-MM-DD; required. At most 366 inclusive dates with date_to.
      schema: { type: string, format: date, example: "2026-10-01" }
    ReportDateTo:
      name: date_to
      in: query
      required: true
      description: Inclusive date, on/after date_from, at most 365 days later. Exact YYYY-MM-DD.
      schema: { type: string, format: date, example: "2026-10-31" }
    ReportDentist:
      name: dentist_id
      in: query
      description: Optional provider ID within the selected clinic. Invalid, blank and foreign-clinic IDs return 422.
      schema: { type: integer, minimum: 1 }
    ReportPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    ReportPerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PatientDocumentId:
      name: document
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ChartDentition:
      name: dentition
      in: query
      schema: { type: string, enum: [adult, primary], default: adult }
    ChartNumbering:
      name: numbering_system
      in: query
      schema: { type: string, enum: [fdi, universal], default: universal }
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: Select an active clinic membership. Omit for default-clinic. Does not confer membership or bypass authorization.
      schema: { type: integer, minimum: 1 }
    AppointmentId: { name: appointment, in: path, required: true, schema: { type: integer, example: 1 } }
    ClinicalNoteId: { name: clinical_note, in: path, required: true, schema: { type: integer, example: 1 } }
    DentistId: { name: dentist, in: path, required: true, schema: { type: integer, example: 1 } }
    InvoiceId: { name: invoice, in: path, required: true, schema: { type: integer, example: 1 } }
    MessageId: { name: message, in: path, required: true, schema: { type: integer, example: 1 } }
    PatientId: { name: patient, in: path, required: true, schema: { type: integer, example: 1 } }
    TreatmentPlanId: { name: treatment_plan, in: path, required: true, schema: { type: integer, example: 1 } }
    PaymentId: { name: payment, in: path, required: true, schema: { type: integer, example: 1 } }
    ReferralId: { name: referral, in: path, required: true, schema: { type: integer, example: 1 } }
    TreatmentId: { name: treatment, in: path, required: true, schema: { type: integer, example: 1 } }
    UserId: { name: user, in: path, required: true, schema: { type: integer, example: 1 } }
  requestBodies:
    PatientBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PatientRequest" } } }
    PatientUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PatientUpdateRequest" } } }
    AppointmentBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentRequest" } } }
    AppointmentUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentUpdateRequest" } } }
    DentistBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DentistRequest" } } }
    DentistUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/DentistUpdateRequest" } } }
    TreatmentBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/TreatmentRequest" } } }
    TreatmentUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/TreatmentUpdateRequest" } } }
    InvoiceBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceRequest" } } }
    InvoiceUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceUpdateRequest" } } }
    PaymentBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PaymentRequest" } } }
    ClinicalNoteBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalNoteRequest" } } }
    ClinicalNoteUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalNoteUpdateRequest" } } }
  responses:
    InventoryConflict:
      description: Duplicate catalog code, conflicting idempotency key, insufficient stock, or ineligible correction.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    ProviderAvailabilityEnvelope:
      description: Standard envelope containing data.availability, including whether rules have been configured.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [availability]
                    properties:
                      availability:
                        allOf:
                          - $ref: "#/components/schemas/ProviderAvailabilityRequest"
                          - type: object
                            required: [dentist_id, configured, timezone]
                            properties:
                              dentist_id: { type: integer }
                              configured: { type: boolean }
                              timezone: { type: string, example: UTC }
    PatientDocumentEnvelope:
      description: Standard envelope with data.document; private/no-store, no storage location.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - properties:
                  data:
                    type: object
                    properties:
                      document: { $ref: "#/components/schemas/PatientDocument" }
    TreatmentPlanEnvelope:
      description: Standard success envelope with data.treatmentPlan. Private/no-store.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - properties:
                  data:
                    type: object
                    properties:
                      treatmentPlan: { $ref: "#/components/schemas/TreatmentPlan" }
    TreatmentPlanItemEnvelope:
      description: Standard success envelope with data.treatmentPlanItem. Private/no-store.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - properties:
                  data:
                    type: object
                    properties:
                      treatmentPlanItem: { $ref: "#/components/schemas/TreatmentPlanItem" }
    DentalChartEnvelope:
      description: Standard envelope with data.chart. New revisions return 201; reads return 200. An uncharted dentition has version 0, an empty tooth list, and null ID/provider/author/note/timestamp/reason.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      chart:
                        allOf:
                          - $ref: "#/components/schemas/DentalChartRevisionSummary"
                          - type: object
                            required: [teeth]
                            properties:
                              teeth: { type: array, items: { $ref: "#/components/schemas/DentalChartTooth" } }
    AuditLogList:
      description: Standard envelope with data.auditLogs and meta.pagination. Empty lists have total 0 and null from/to.
      headers:
        Cache-Control: { schema: { type: string }, description: 'private, no-store' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { type: object, properties: { auditLogs: { type: array, items: { $ref: "#/components/schemas/AuditLog" } } } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    AuditLogEnvelope:
      description: Standard envelope with data.auditLog and null meta.
      headers:
        Cache-Control: { schema: { type: string }, description: 'private, no-store' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { type: object, properties: { auditLog: { $ref: "#/components/schemas/AuditLog" } } }
    AuditLogFilters:
      description: Standard envelope with sorted unique data.actions and data.resourceTypes.
      headers:
        Cache-Control: { schema: { type: string }, description: 'private, no-store' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      actions: { type: array, items: { type: string } }
                      resourceTypes: { type: array, items: { type: string } }
    RoleList:
      description: Standard envelope with data.roles, including permissions.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { type: object, properties: { roles: { type: array, items: { $ref: "#/components/schemas/Role" } } } }
    RoleEnvelope:
      description: Standard envelope with data.role, including permissions.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { type: object, properties: { role: { $ref: "#/components/schemas/Role" } } }
    PermissionList:
      description: Standard envelope with data.permissions ordered by slug.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { type: object, properties: { permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } } } }
    DeleteMessage:
      description: Resource deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiErrorEnvelope"
              - type: object
                properties:
                  statusCode: { type: integer, example: 401 }
                  message: { type: string, example: Unauthenticated. }
                  code: { type: string, example: UNAUTHENTICATED }
    Forbidden:
      description: The user lacks permission for this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiErrorEnvelope"
              - type: object
                properties:
                  statusCode: { type: integer, example: 403 }
                  message: { type: string, example: This action is unauthorized. }
                  code: { type: string, example: FORBIDDEN }
    AlreadyAuthenticated:
      description: The browser session is already authenticated.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiErrorEnvelope"
              - type: object
                properties:
                  statusCode: { type: integer, example: 409 }
                  message: { type: string, example: Already authenticated. }
                  code: { type: string, example: ALREADY_AUTHENTICATED }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiErrorEnvelope"
              - type: object
                properties:
                  statusCode: { type: integer, example: 404 }
                  message: { type: string, example: Resource not found. }
                  code: { type: string, example: NOT_FOUND }
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiErrorEnvelope"
              - type: object
                properties:
                  statusCode: { type: integer, example: 422 }
                  message: { type: string, example: The given data was invalid. }
                  code: { type: string, example: VALIDATION_ERROR }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
    DentistList:
      description: Dentist list.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
