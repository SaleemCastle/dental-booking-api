        appointmentStartsAt: { type: string, format: date-time, nullable: true, readOnly: true }
        is_overdue: { type: boolean, readOnly: true, description: Open task with due_date strictly before the application's current calendar date. }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    ClinicalNote:
      type: object
      description: Canonical IDs are integers; dentist_id identifies the clinical provider independently of the authenticated author. Attribution is nullable only for legacy notes whose original authorship is unknown. API-created notes always capture author and editor. Response timestamps use ISO 8601 UTC.
      required: [id, patient_id, dentist_id, appointment_id, note_text, author_user_id, updated_by_user_id, authorName, updatedByName, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, example: 1 }
        dentist_id: { type: integer, example: 1 }
        appointment_id: { type: integer, nullable: true, example: 1 }
        note_text: { type: string, example: Patient reported sensitivity. }
        author_user_id: { type: integer, nullable: true, readOnly: true, description: Immutable authenticated author. Null for unattributed legacy notes. }
        updated_by_user_id: { type: integer, nullable: true, readOnly: true, description: Authenticated last editor. Initially the author for API-created notes. }
        authorName: { type: string, nullable: true, readOnly: true }
        updatedByName: { type: string, nullable: true, readOnly: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ClinicalNoteRequest:
      type: object
      description: author_user_id, updated_by_user_id, deleted_by_user_id, deleted_at, created_at, and updated_at must be absent, including null values. Provider and author are distinct identities. When appointment_id is supplied, the patient and provider must match that appointment.
      required: [patient_id, dentist_id, note_text]
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        note_text: { type: string, minLength: 1, maxLength: 16000 }
    ClinicalNoteUpdateRequest:
      type: object
      description: All fields are optional; omitted fields remain unchanged. Appointment may be explicitly cleared with null. Relationship checks use the merged record. Authorship, editor/deletion attribution, and timestamps are server-controlled and must be absent.
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        note_text: { type: string, minLength: 1, maxLength: 16000 }
