          description: Updated patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
  /api/patients/{patient}/delete:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    delete:
      tags: [Patients]
      summary: Legacy patient archive endpoint
      deprecated: true
      description: Legacy route retained for compatibility. It archives the patient and does not hard-delete the record.
      responses:
        "200":
          description: Patient archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
  /api/dentists/{dentist}/availability:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/DentistId"
    get:
      tags: [Provider Availability]
      summary: Get provider scheduling rules
      description: Requires provider_availabilities.view or the admin role in the selected clinic. Returns configured false with empty lists for a provider without a saved schedule; such providers retain legacy overlap-only booking. Rules use the application timezone. Foreign-clinic providers return 404.
      responses:
        "200":
          $ref: "#/components/responses/ProviderAvailabilityEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Provider Availability]
      summary: Replace provider scheduling rules
      description: Requires provider_availabilities.update or the admin role. All three lists must be present; empty weekly_hours closes unlisted dates. Exceptions replace weekly hours and breaks for their date; empty working_hours means a full day off. Day numbers are 0 (Sunday) through 6 (Saturday). Intervals must increase within one day; end_time may be 24:00. Split overnight hours across days. Overlapping or adjacent working windows form continuous coverage; breaks subtract availability. Existing appointments remain unchanged. Writes and minimal created/updated audits are atomic; identical payloads emit no audit. Provider-row locks coordinate rule changes with bookings. No per-room/chair hours are introduced. See docs/provider-availability.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAvailabilityRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProviderAvailabilityEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointment-locations:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Appointments]
      summary: List rooms and their chairs for booking selectors
      description: Requires appointments.view permission or the admin role. Returns canonical integer room and chair IDs ordered by name then ID. Rooms are exclusive booking resources, including when different chairs are selected within the same room.
      responses:
        "200":
          description: Available location records. This is an inventory list, not a time-specific availability query.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rooms: { type: array, items: { $ref: "#/components/schemas/AppointmentRoom" } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/appointments:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Appointments]
      summary: List appointments
      description: Requires appointments.view permission or the admin role. The optional date filters starts in the application timezone (UTC). Responses contain canonical numeric IDs, display names, and ISO 8601 UTC startsAt/endsAt fields.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-10-05"
      responses:
        "200":
          description: Appointment list with display-ready fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          appointments:
                            type: array
                            items:
                              $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Appointments]
      summary: Create appointment
      description: Requires appointments.create permission or the admin role. Creates a scheduled appointment. Accepts canonical snake_case fields and documented camelCase aliases; canonical values take precedence. Archived patients and inactive treatments cannot be selected. Duration defaults to the selected treatment duration or 30 minutes. Optional chair_id derives room_id when room_id is omitted. For configured providers the entire appointment must fit working hours after breaks and date overrides, otherwise returns 422 with dentist_id and appointment_date_time errors. Unconfigured providers retain legacy overlap-only booking. Provider, chair, and room overlaps with active appointments return 422, including across midnight; adjacent intervals are allowed. Offset timestamps are normalized to UTC. See docs/appointment-workflow.md for transition and locking rules.
      requestBody:
        $ref: "#/components/requestBodies/AppointmentBody"
      responses:
        "201":
          description: Appointment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    get:
      tags: [Appointments]
      summary: Get appointment
      description: Requires appointments.view permission or the admin role.
      responses:
        "200":
          description: Appointment details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Appointments]
      summary: Update appointment
      description: Requires appointments.update permission or the admin role. PATCH and PUT both accept partial updates and preserve omitted fields. Active changes to provider, chair, room, start, treatment, or explicit duration validate configured provider availability and existing overlaps. Availability failures return 422 under dentist_id and appointment_date_time without saving changes. Notes and status-only updates remain possible after later schedule edits. Completed, cancelled, and no_show appointments cannot be rescheduled. Appointments with clinical notes, including soft-deleted notes, cannot change patient/provider. Appointments linked to tasks cannot change patient. Status changes use the workflow rules described in docs/appointment-workflow.md. Repeating the current status is idempotent and preserves timestamps.
      requestBody:
        $ref: "#/components/requestBodies/AppointmentUpdateBody"
      responses:
        "200":
          description: Appointment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Appointments]
      summary: Update appointment
      description: Requires appointments.update permission or the admin role. Uses the same partial update, conflict validation, and status transition rules as PATCH.
      requestBody:
        $ref: "#/components/requestBodies/AppointmentUpdateBody"
      responses:
        "200":
          description: Appointment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Appointments]
      summary: Delete appointment
      description: Requires appointments.delete permission or the admin role. Physically deletes appointments without clinical notes. Notes, including soft-deleted notes, prevent deletion with a 422 appointment_id error. Use the cancel action to retain appointment history and release its slot.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}/check-in:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Mark appointment as checked in
      description: Requires appointments.update permission or the admin role. Only scheduled appointments can transition to checked_in. Repeating checked_in succeeds without changing checked_in_at. Other transitions return 422.
      responses:
        "200":
          description: Appointment status changed to checked_in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}/complete:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Mark appointment as completed
      description: Requires appointments.update permission or the admin role. Only in_progress appointments can transition to completed; first use PATCH with status in_progress after check-in. Repeating completed preserves completed_at. Other transitions return 422.
      responses:
        "200":
          description: Appointment status changed to completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}/cancel:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Cancel appointment
      description: Requires appointments.update permission or the admin role. Scheduled, checked_in, and in_progress appointments may be cancelled. Cancellation releases provider and location reservations. Repeating cancellation preserves cancelled_at and retains the existing reason when omitted. Completed and no_show appointments cannot be cancelled.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: Alias for cancellation_reason. Canonical cancellation_reason takes precedence when both are present.
                  example: Patient requested cancellation.
                cancellation_reason:
                  type: string
                  nullable: true
                  maxLength: 2000
      responses:
        "200":
          description: Appointment status changed to cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/dentists:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Dentists]
      summary: List dentists
      responses:
        "200":
          $ref: "#/components/responses/DentistList"
    post:
      tags: [Dentists]
      summary: Create dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistBody"
      responses:
        "201":
          $ref: "#/components/responses/DentistEnvelope"
  /api/dentists/{dentist}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/DentistId"
    get:
      tags: [Dentists]
      summary: Get dentist
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    patch:
      tags: [Dentists]
      summary: Update dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    put:
      tags: [Dentists]
      summary: Update dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    delete:
      tags: [Dentists]
      summary: Delete dentist
      description: Providers with clinical notes, including soft-deleted notes, cannot be deleted. Such requests return 422 with a dentist_id error to preserve clinical history.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/treatments:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Treatments]
      summary: List treatments
      description: Requires treatments.view permission or the admin role. Returns all matching treatments ordered by name then ID, without pagination. Omit active to include historical inactive treatments. Use active=1 for booking selectors.
      parameters:
        - name: active
          in: query
          required: false
          description: Filter by active status. Use 1 for active treatments or 0 for inactive treatments. Other query strings, including true and false, are rejected.
          schema: { type: integer, enum: [0, 1] }
      responses:
        "200":
          $ref: "#/components/responses/TreatmentList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Treatments]
      summary: Create treatment
      description: Requires treatments.create permission or the admin role. Treatments default to active when active is omitted.
      requestBody:
        $ref: "#/components/requestBodies/TreatmentBody"
      responses:
        "201":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/treatments/{treatment}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/TreatmentId"
    get:
      tags: [Treatments]
      summary: Get treatment
      description: Requires treatments.view permission or the admin role. Inactive treatments remain accessible for historical records.
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Treatments]
      summary: Update treatment
      description: Requires treatments.update permission or the admin role. Only supplied fields change. Set active to false to deactivate or true to reactivate.
      requestBody:
        $ref: "#/components/requestBodies/TreatmentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Treatments]
      summary: Update treatment
      description: Requires treatments.update permission or the admin role. Accepts partial updates with the same semantics as PATCH.
      requestBody:
        $ref: "#/components/requestBodies/TreatmentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Treatments]
      summary: Deactivate treatment
      description: Requires treatments.delete permission or the admin role. Sets active to false and retains the treatment and all appointment references. Repeated deletion succeeds. Returns message "Treatment successfully deactivated." with null data.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/invoices:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Invoices]
      summary: List invoices
      description: Requires billing read access. Paginated data array with immutable line snapshots; see docs/billing.md.
      parameters:
        - { name: patient_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/InvoiceStatus" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        "200":
          $ref: "#/components/responses/InvoiceList"
    post:
      tags: [Invoices]
      summary: Create invoice
      description: Creates a draft with immutable price snapshots. All money uses two decimal places. Totals and lifecycle timestamps are server-controlled. Requires Admin/Billing role or invoices.create. See docs/billing.md.
      requestBody:
        $ref: "#/components/requestBodies/InvoiceBody"
      responses:
        "201":
          $ref: "#/components/responses/InvoiceEnvelope"
  /api/invoices/{invoice}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/InvoiceId"
    get:
      tags: [Invoices]
      summary: Get invoice
      responses:
        "200":
          $ref: "#/components/responses/InvoiceEnvelope"
    patch:
      tags: [Invoices]
      summary: Update invoice
      requestBody:
        $ref: "#/components/requestBodies/InvoiceUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/InvoiceEnvelope"
    put:
      tags: [Invoices]
      summary: Update invoice
      requestBody:
        $ref: "#/components/requestBodies/InvoiceUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/InvoiceEnvelope"
  /api/payments:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Payments]
      summary: List payments
      parameters:
        - { name: invoice_id, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        "200":
          $ref: "#/components/responses/PaymentList"
    post:
      tags: [Payments]
      summary: Record settled payment
      description: Records a positive settled payment up to the outstanding balance in the invoice currency. Requires Admin/Billing role or payments.create. The invoice-scoped idempotency key deduplicates identical retries. Unknown fields, card data and arbitrary metadata are rejected. See docs/billing.md.
      requestBody:
        $ref: "#/components/requestBodies/PaymentBody"
      responses:
        "200":
          $ref: "#/components/responses/PaymentEnvelope"
        "201":
          $ref: "#/components/responses/PaymentEnvelope"
  /api/payments/{payment}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [Payments]
      summary: Get payment
      responses:
        "200":
          $ref: "#/components/responses/PaymentEnvelope"
  /api/invoices/{invoice}/payment-links:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/InvoiceId" }
    get:
      tags: [Payment Links]
      summary: List invoice payment-link attempts
      description: Requires payment_links.view or Admin/Billing/Auditor. Private/no-store. Does not contact the gateway. See docs/payment-links.md.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        "200":
          description: Paginated payment-link array with standard meta.pagination.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/PaymentLink" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Payment Links]
      summary: Create an invoice hosted checkout
      description: Requires payment_links.create or Admin/Billing. Server derives amount and currency from the issued invoice ledger under lock. Only one unresolved checkout per invoice. Unknown fields including card data and amount overrides are rejected. Keys are case-sensitive and scoped to the invoice. Only verified server-to-server paid results can settle the ledger. Private/no-store. See docs/payment-links.md for reconciliation and HandyPay limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$', example: checkout-2026-001 }
      responses:
        "201": { $ref: "#/components/responses/PaymentLinkEnvelope" }
        "200": { $ref: "#/components/responses/PaymentLinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PaymentProviderError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/PaymentProviderError" }
        "503": { $ref: "#/components/responses/PaymentProviderError" }
        "504": { $ref: "#/components/responses/PaymentProviderError" }
  /api/payment-links/{payment_link}:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/PaymentLinkId" }
    get:
      tags: [Payment Links]
      summary: Get stored hosted payment-link attempt
      description: Requires payment_links.view or Admin/Billing/Auditor. Private/no-store. Never returns tenant credentials.
      responses:
        "200": { $ref: "#/components/responses/PaymentLinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/payment-links/{payment_link}/refresh:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/PaymentLinkId" }
    post:
      tags: [Payment Links]
      summary: Refresh payment-link status from the provider
      description: Empty body. Requires payment_links.refresh or Admin/Billing. A verified paid session with matching amount and currency records one ledger payment and updates the invoice balance. Settled terminal statuses are no-ops; historical completed-but-unsettled sessions can be reconciled. Browser parameters cannot prove payment. Private/no-store.
      responses:
        "200": { $ref: "#/components/responses/PaymentLinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PaymentProviderError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/PaymentProviderError" }
        "503": { $ref: "#/components/responses/PaymentProviderError" }
        "504": { $ref: "#/components/responses/PaymentProviderError" }
  /api/payment-links/{payment_link}/cancel:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
      - { $ref: "#/components/parameters/PaymentLinkId" }
    post:
      tags: [Payment Links]
      summary: Cancel a hosted payment link if supported by the provider
      description: Empty body. Requires payment_links.cancel or Admin/Billing. Cancellation is stored and audited only after provider confirmation. HandyPay hosted sessions currently return 409 PAYMENT_PROVIDER_OPERATION_UNSUPPORTED; the checkout remains outstanding. Private/no-store.
      responses:
        "200": { $ref: "#/components/responses/PaymentLinkEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PaymentProviderError" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/PaymentProviderError" }
        "503": { $ref: "#/components/responses/PaymentProviderError" }
        "504": { $ref: "#/components/responses/PaymentProviderError" }
  /api/webhooks/handypay/{endpoint}:
    post:
      tags: [Payments]
      security: []
      summary: Receive a signed HandyPay payment event
      description: Uses the credential revision identified by endpoint, independent of browser authentication and X-Tenant-Id. Verifies HMAC-SHA256 against the exact raw body before parsing. Event receipt and settlement commit atomically. Duplicates are idempotent. Unknown events are ignored. Signed unmatched or conflicting events are retained for operator reconciliation and acknowledged; identical redelivery can retry unresolved events. Raw payloads are never stored or logged.
      parameters:
        - { name: endpoint, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-HandyPay-Signature, in: header, required: true, schema: { type: string, pattern: '^sha256=[a-fA-F0-9]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id: { type: string, example: evt_abc123 }
                type: { type: string, example: checkout.session.completed }
                created: { type: integer }
                livemode: { type: boolean }
                data: { type: object, description: "HandyPay resource directly in data. Successful sessions require id, amount_total, currency and payment_status paid." }
      responses:
        "200": { description: Verified event durably received; data.received is true. Check stored event outcome for settlement or reconciliation status. }
        "400": { description: Invalid signed event. }
        "401": { description: Missing or invalid signature or unknown endpoint. }
        "409": { description: An event ID was reused with different raw content. }
        "413": { description: Payload exceeds 1 MiB. }
        "503": { description: Configuration unavailable or transient processing failure; delivery may be retried. }
  /api/tasks:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Tasks]
      summary: List follow-up tasks
      description: Requires tasks.view permission or the admin role. Filters combine with AND before pagination. assigned_to_me uses the authenticated user's ID. overdue and due_today include only pending/in_progress tasks and use the application's calendar date (UTC). Boolean query toggles accept 1 or 0; 0 disables a filter. Without date filters, all task statuses are included. Results are ordered by due_date ascending then ID ascending. See docs/tasks.md.
      parameters:
        - name: assigned_to_me
          in: query
          schema: { type: integer, enum: [0, 1] }
        - name: overdue
          in: query
          description: Open tasks with due_date strictly before today.
          schema: { type: integer, enum: [0, 1] }
        - name: due_today
          in: query
          description: Open tasks with due_date equal to today.
          schema: { type: integer, enum: [0, 1] }
        - name: patient_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Tasks]
      summary: Create follow-up task
      description: Requires tasks.create permission or the admin role. Assignee, due_date, and description are required. Patient and appointment are optional. An appointment derives patient_id when patient_id is omitted; an explicitly supplied patient must match the appointment. Due dates may be in the past. Priority defaults to normal and status to pending. Any valid initial status is accepted; completed tasks receive a server-generated completed_at timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "201":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/tasks/{task}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - name: task
        in: path
        required: true
        schema: { type: integer, example: 1 }
    get:
      tags: [Tasks]
      summary: Get follow-up task
      description: Requires tasks.view permission or the admin role. Assignment alone grants no access.
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      summary: Update or reassign follow-up task
      description: Requires tasks.update permission or the admin role. Preserves omitted fields. Changing appointment_id without patient_id derives the new appointment's patient. Clearing appointment_id keeps the patient; clear both IDs to make a general task. Relationship mismatches return 422. Any valid status change is allowed, including reopening a completed/cancelled task. completed_at is generated on completion, preserved on repeated completion, and cleared when leaving completed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFields" }
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Tasks]
      summary: Update follow-up task
      description: Uses the same partial update, tasks.update authorization, relationship checks, and completion timestamp behavior as PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFields" }
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Tasks]
      summary: Delete follow-up task
      description: Requires tasks.delete permission or the admin role. Physically deletes the task. Use status cancelled to retain it instead. Subsequent requests for the deleted ID return 404.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks/{task}/status:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - name: task
        in: path
        required: true
        schema: { type: integer, example: 1 }
    patch:
      tags: [Tasks]
      summary: Change follow-up task status
      description: Requires tasks.update permission or the admin role. Accepts any valid status, including reopening. Other task fields and server-managed timestamps must be absent. Uses the same completion timestamp behavior as the general update endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/clinical-notes:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Clinical Notes]
      summary: List clinical notes
      description: Admins and dentists can read clinic notes. Other users require clinical_notes.view (wildcards supported for reads). Soft-deleted notes are excluded. Results are ordered by created_at descending, then ID descending, with meta.pagination. See docs/clinical-notes.md for clinical-role and audit integration rules.
      parameters:
        - name: patient_id
          in: query
          schema: { type: integer }
        - name: dentist_id
          in: query
          description: Filter by provider ID.
          schema: { type: integer }
        - name: appointment_id
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Clinical Notes]
      summary: Create clinical note
      description: Requires the admin role or the dentist role without the receptionist role. Permissions and wildcards alone cannot grant clinical writes. Appointment is optional; when present, its patient and provider must match the supplied patient_id and dentist_id. The authenticated user becomes author and last editor. Client-supplied attribution, deletion fields, and timestamps are rejected. Appointment status and patient archival do not prevent clinical documentation. Creation atomically appends a minimal audit record with actor, action, resource ID, UTC timestamp, and allowlisted request context; no clinical text is copied. See docs/audit-logging.md.
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteBody"
      responses:
        "201":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/clinical-notes/{clinical_note}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/ClinicalNoteId"
    get:
      tags: [Clinical Notes]
      summary: Get clinical note
      description: Uses the same read authorization as the clinical note list. Soft-deleted notes return 404.
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Clinical Notes]
      summary: Update clinical note
      description: Requires the admin role or the dentist role without the receptionist role. Dentists may collaborate on clinic notes; authorship remains immutable and changed notes capture the authenticated last editor. Omitted fields are preserved. Relationship validation checks the merged note and appointment. Explicit appointment_id null detaches the appointment. Changes atomically append a minimal audit record and publish an after-commit ClinicalNoteChanged event with actor and before/after snapshots. No-op updates preserve metadata and produce neither an audit record nor an event. Audit storage excludes clinical text and event snapshots; storage failures roll back the mutation. See docs/audit-logging.md.
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Clinical Notes]
      summary: Update clinical note
      description: Uses the same partial update, clinical-role authorization, immutable authorship, relationship validation, and audit event behavior as PATCH.
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Clinical Notes]
      summary: Delete clinical note
      description: Requires the admin role or the dentist role without the receptionist role. Soft-deletes the note, retaining its contents, author, editor, deleted_by_user_id, and deleted_at. Atomically appends a minimal audit record and publishes an after-commit ClinicalNoteChanged event. Audit storage excludes clinical text and event snapshots; storage failures roll back the deletion. Subsequent show, update, or delete requests return 404. See docs/audit-logging.md.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/messages:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Messages]
      summary: Retired legacy messages API
      responses:
        "410":
          description: Retired. Use conversation-threads; legacy records are not exposed.
    post:
      tags: [Messages]
      summary: Retired legacy message creation
      responses:
        "410":
          description: Retired. Patient-to-patient messaging is prohibited.
  /api/messages/{message}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [Messages]
      summary: Retired legacy message lookup
      responses:
        "410":
          description: Retired. Use conversation-threads.
    patch:
      tags: [Messages]
      summary: Retired legacy message update
      responses:
        "410":
          description: Retired. Conversation messages are append-only.
    put:
      tags: [Messages]
      summary: Retired legacy message replacement
      responses:
        "410":
          description: Retired. Conversation messages are append-only.
    delete:
      tags: [Messages]
      summary: Retired legacy message deletion
      responses:
        "410":
          description: Retired. Use the controlled redaction workflow.
  /api/conversation-threads:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Messages]
      summary: List authorized conversations
      description: Active participants with exact view permission only. Send grants do not imply viewing. Admins never see patient threads. Search matches subjects only. Reads are access-logged. Default lists omit archived threads. See docs/communication-governance.md.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: archived, in: query, description: Include archived conversations when true., schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: ApiEnvelope with data.threads and meta.pagination. }
    post:
      tags: [Messages]
      summary: Start an authorized conversation
      description: Requires exact view and send grants for the channel/thread kind. Patient recipients need patient view. Patient threads require consent and exclude every admin. Staff cannot target admins. Attachments disabled. Ten new threads per actor per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string, maxLength: 200, example: Care coordination }
                user_ids: { type: array, maxItems: 20, items: { type: integer }, example: [] }
                patient_id: { type: integer, description: Optional patient; requires care or billing use_case. }
                use_case: { type: string, enum: [care, billing, appointments, general] }
      responses:
        "201": { description: ApiEnvelope with data.thread and its participants. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Thread creation or shared HTTP rate limit reached. }
  /api/conversation-threads/{thread}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Messages]
      summary: Get a participating conversation
      responses:
        "200": { description: ApiEnvelope with data.thread and participants. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/conversation-threads/{thread}/messages:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Messages]
      summary: List authorized thread messages
      description: Requires active participation and exact internal/patient view grant. Read is access-logged. Oldest first. Sender and governance redactions hide body/reason. Original content stays in protected storage. Governance redaction details use the permission-controlled history endpoint.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: ApiEnvelope with data.messages and meta.pagination. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Messages]
      summary: Send or append a controlled correction or redaction
      description: Sender and recipients derived server-side. Patient sends require a prepared confirmation token and explicit send_confirmed and consent_acknowledged flags. Consent is rechecked. Same tenant/actor idempotency key replays identical payload. Internal state available; patient state awaiting_portal, not delivered. No external provider calls. See docs/platform-messaging.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationSendRequest" }
      responses:
        "201": { description: 'ApiEnvelope with data.message containing sender_id, actor_id, recipient_ids, thread_id, body, kind, supersedes_id, reason, channel, delivery_state, audit_metadata, created_at and redacted.' }
        "200": { description: 'Identical idempotent retry; same message, with current redaction applied.' }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 'Key reused with different payload, or target already redacted.' }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: 'Twenty new messages per sender/minute or fifty per patient/hour, or shared HTTP limit.' }
  /api/conversation-threads/{thread}/confirmations:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Messages]
      summary: Prepare exact patient message for explicit send confirmation
      description: Does not send. Returns a single-use token valid for five minutes, bound to actor, tenant, thread and exact payload. UI must obtain explicit user confirmation and consent acknowledgement after showing the preview. Subsequent send uses the exact same payload plus token and both true flags.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationSendRequest" }
      responses:
        "201": { description: 'ApiEnvelope data contains confirmation_token, expires_at, body, kind, supersedes_id, reason, channel, use_case, patient_id, current patient consent decision and acknowledgement_required. Staff confirmation is separate from patient consent.' }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Shared HTTP rate limit reached. }
  /api/users/{user}/messaging-permissions:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Messages]
      summary: Configure tenant user messaging overrides
      description: Requires admin role plus exact messaging.settings.manage. Only supplied override fields change; provide at least one. Null inherits exact role permission; false denies; true grants. Send permissions never imply view. Admin patient view/send grant attempts are prohibited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                internal_send: { type: boolean, nullable: true, example: null }
                internal_receive: { type: boolean, nullable: true, example: null }
                patient_send: { type: boolean, nullable: true, example: false }
                internal_view: { type: boolean, nullable: true }
                patient_view: { type: boolean, nullable: true }
                settings_manage: { type: boolean, nullable: true }
                history_view: { type: boolean, nullable: true }
                assign: { type: boolean, nullable: true }
                escalate: { type: boolean, nullable: true }
                supervise: { type: boolean, nullable: true }
                archive: { type: boolean, nullable: true }
                redact: { type: boolean, nullable: true }
                export: { type: boolean, nullable: true }
      responses:
        "200": { description: ApiEnvelope with data.messaging_permissions. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/communication-governance/policy:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Communication Governance]
      summary: Get clinic communication governance policy
      description: Exact messaging.settings.manage required. No policy means indefinite retention and disabled automatic archive/escalation.
      responses:
        "200": { description: ApiEnvelope with data.policy and originals_retained=true. }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Communication Governance]
      summary: Record an immutable clinic retention and escalation policy version
      description: Exact settings grant required. Retention days are a minimum from latest activity, not a deletion deadline. Policy reference must identify the clinic compliance decision. Originals remain retained; automatic purge is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retention_days, archive_after_days, escalation_enabled, policy_reference]
              properties:
                retention_days: { type: integer, nullable: true, minimum: 1, maximum: 36500 }
                archive_after_days: { type: integer, nullable: true, minimum: 1, maximum: 36500 }
                escalation_enabled: { type: boolean, example: false }
                policy_reference: { type: string, maxLength: 2000, example: Clinic-approved policy reference. }
      responses:
        "201": { description: ApiEnvelope with data.policy and originals_retained=true. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/users/{user}/communication-access/deactivate:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Communication Governance]
      summary: Revoke staff messaging access while retaining historical authorship
      description: Admin plus settings-manage required. Revokes current thread access and all messaging overrides in this clinic. Other clinic memberships and historical messages remain intact. Hand off patient responsibility before deactivating the last eligible participant.
      responses:
        "200": { description: ApiEnvelope confirmation. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/conversation-threads/{thread}/handoff:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communication Governance]
      summary: Hand off patient responsibility to permitted staff
      description: Active participation plus patient view and messaging.assign required. Target must have patient view/send. Revokes previous assignee except current reviewer; retains original authorship. Invalidates prepared send confirmations. No tenant-wide visibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceTargetRequest" }
      responses:
        "201": { description: ApiEnvelope with data.event including actor and assignment history. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Archived thread or unchanged assignment. }
  /api/conversation-threads/{thread}/escalate:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communication Governance]
      summary: Escalate a patient thread to one explicitly selected supervisor
      description: Active participation plus patient view and messaging.escalate required. Clinic policy must enable escalation. Target requires patient view and supervise; admin targets prohibited. Grants this thread only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceTargetRequest" }
      responses:
        "201": { description: ApiEnvelope with data.event. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Archived or already escalated thread. }
  /api/conversation-threads/{thread}/resolve:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communication Governance]
      summary: Resolve escalation and remove temporary supervisor access
      description: Only the selected supervisor with active view and supervise grants may resolve. Preserves pre-existing participation or newly assigned responsibility; otherwise temporary access is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceReasonRequest" }
      responses:
        "201": { description: ApiEnvelope with data.event. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/conversation-threads/{thread}/archive:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communication Governance]
      summary: Archive or reopen an authorized conversation
      description: Requires active participation plus view/archive grants. Archived records remain readable but reject sends and confirmations. Unresolved escalations cannot be archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/GovernanceReasonRequest" }
                - { type: object, required: [archived], properties: { archived: { type: boolean, example: true } } }
      responses:
        "201": { description: ApiEnvelope with data.event. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Unresolved escalation or unchanged archive state. }
  /api/conversation-threads/{thread}/hold:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communication Governance]
      summary: Record a retention legal hold or its release
      description: Requires active participation plus view/settings-manage grants. Legal hold means indefinite retention and exemption from automatic archive. It never grants patient access to an administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/GovernanceReasonRequest" }
                - { type: object, required: [enabled], properties: { enabled: { type: boolean, example: true } } }
      responses:
        "201": { description: ApiEnvelope with data.event. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/conversation-threads/{thread}/redact:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communication Governance]
      summary: Apply an auditable visibility redaction without mutating original content
      description: Requires participation plus view/redact grants. Records actor/time/reason and original retention policy. Applies to any sender's message in this thread. Originals are retained; list/retry/export hide body and reason. Does not dispatch a patient message or substitute for consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/GovernanceReasonRequest" }
                - { type: object, required: [message_id], properties: { message_id: { type: integer } } }
      responses:
        "201": { description: ApiEnvelope with immutable data.event. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Message already redacted through governance. }
  /api/conversation-threads/{thread}/history:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Communication Governance]
      summary: Review authorized governance and access/export evidence
      description: Requires active participation plus view/history-view grants. Includes protected reasons and actor/time metadata. Access itself is audited.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: ApiEnvelope with governance-event array in data and meta.pagination. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/conversation-threads/{thread}/export:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: thread, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Communication Governance]
      summary: Export an authorized redacted message-history page with access logging
      description: Requires active participation plus view/export grants. Returns private/no-store JSON attachment; each page records actor/time/purpose and exact message IDs. Does not expose unredacted originals. Archived history may be exported by authorized participants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/GovernanceReasonRequest" }
                - type: object
                  properties:
                    page: { type: integer, minimum: 1, example: 1 }
                    per_page: { type: integer, minimum: 1, maximum: 100, example: 100 }
      responses:
        "200": { description: 'ApiEnvelope with data.thread, messages, retention, pagination, policy_version and export_event_id.' }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/patients/{patient}/messaging-preferences:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Messages]
      summary: Review patient in-app communication preferences
      description: Staff with exact messaging.preferences.manage only; admins and patient sessions prohibited.
      responses:
        "200": { description: ApiEnvelope with data.preferences. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Messages]
      summary: Record patient consent or withdrawal with evidence
      description: Compatibility adapter to append-only communication consent. Same staff authorization as GET. Allowed true appends granted; false appends withdrawn. Requires source and acknowledged policy text/version. Use communication-consents for all states and channels. Missing consent defaults to denial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, use_case, allowed, evidence, source, text_version, acknowledged_text]
              properties:
                channel: { type: string, enum: [in_app] }
                use_case: { type: string, enum: [care, billing] }
                allowed: { type: boolean, example: false }
                evidence: { type: string, maxLength: 2000, example: Patient withdrew in-app care messaging consent. }
                source: { type: string, enum: [in_person, written_form, phone, patient_request] }
                text_version: { type: string, maxLength: 100, example: care-v1 }
                acknowledged_text: { type: string, maxLength: 10000, example: I withdraw consent to in-app care messages. }
      responses:
        "200": { description: ApiEnvelope with data.preference. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/communication-consents:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Communication Consent]
      summary: Review append-only patient communication consent history
      description: Staff with exact messaging.preferences.manage only. Admin and patient roles prohibited on staff endpoints. Returns original evidence and acknowledged wording; tenant-scoped and private/no-store. See docs/communication-consent.md.
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [transactional, clinical, general] } }
        - { name: channel, in: query, schema: { type: string, enum: [in_app, email, sms] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: ApiEnvelope data is newest-first consent history array with meta.pagination. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Communication Consent]
      summary: Append a patient consent grant or refusal
      description: Explicitly permitted staff only. Creates the next immutable version per patient/purpose/scope/channel under a tenant lock. Captured_by and captured_at are server-derived; callers cannot override them or version. Staff attest the patient's actual choice independently of the sender's send confirmation. Never overwrites earlier evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationConsentRequest" }
      responses:
        "201": { description: ApiEnvelope with data.consent including source and capture attribution/time plus acknowledged policy text/version. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/communication-consents/current:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Communication Consent]
      summary: Resolve current effective patient consent
      description: Same staff authorization as history. Exact scope and channel only; no fallback. Missing consent denies. Resolution does not send. Actual sends resolve again and capture the consent ID/version used. In-app blocked sends return 403 COMMUNICATION_CONSENT_BLOCKED with errors.consent.reason and the decision; provider workers suppress with the same reason as failure_reason.
      parameters:
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [transactional, clinical, general], example: clinical } }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [appointments, billing, payment_receipts, follow_up, non_essential], example: follow_up } }
        - { name: channel, in: query, required: true, schema: { type: string, enum: [in_app, email, sms], example: in_app } }
      responses:
        "200": { description: 'ApiEnvelope data.consent contains allowed, reason, patient_id, purpose, scope, channel, consent_id, version, status, text_version, source, capture_actor_type, captured_by, captured_by_patient_id and captured_at. Reasons are consent_granted, consent_missing, consent_declined, consent_withdrawn and consent_revoked.' }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/patients/{patient}/operational-notice-bases:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Communication Consent]
      summary: Review separate emergency and legal operational-basis evidence
      description: Same exact staff permission as consent history. Basis records never grant patient consent or bypass sending policy.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: ApiEnvelope data is newest-first operational-basis history with meta.pagination. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Communication Consent]
      summary: Record operational notice basis without authorizing dispatch
      description: Same exact staff permission as consent capture. Server stamps actor and time. This separate immutable record does not override patient consent. Actual exceptional dispatch remains a separately authorized future workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, basis, reason, authority_reference]
              properties:
                channel: { type: string, enum: [in_app, email, sms] }
                basis: { type: string, enum: [emergency, legal_obligation] }
                reason: { type: string, maxLength: 2000, example: Specific operational notice justification. }
                authority_reference: { type: string, maxLength: 2000, example: Reviewed authority REF-1. }
      responses:
        "201": { description: ApiEnvelope with data.notice_basis and data.dispatch_authorized=false. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/referrals:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Referrals]
      summary: List referrals
      responses:
        "200":
          description: Referral list.
    post:
      tags: [Referrals]
      summary: Create referral
      responses:
        "201":
          description: Referral created.
  /api/referrals/{referral}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/ReferralId"
    get:
      tags: [Referrals]
      summary: Get referral
      responses:
        "200":
          description: Referral details.
    patch:
      tags: [Referrals]
      summary: Update referral
      responses:
        "200":
          description: Referral updated.
    put:
      tags: [Referrals]
      summary: Update referral
      responses:
        "200":
          description: Referral updated.
    delete:
      tags: [Referrals]
      summary: Delete referral
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/users:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Users]
      summary: List users
      responses:
        "200":
          description: User list.
    post:
      tags: [Users]
      summary: Create user
      responses:
        "201":
          description: User created.
  /api/users/{user}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get user
      responses:
        "200":
          description: User details.
    patch:
      tags: [Users]
      summary: Update user
      responses:
        "200":
          description: User updated.
    put:
      tags: [Users]
      summary: Update user
      responses:
        "200":
          description: User updated.
    delete:
      tags: [Users]
      summary: Delete user
      description: Removes the user from the selected clinic. Reassign or delete all of this member's selected-clinic tasks first; otherwise returns 422 on field user without changing memberships, roles, accounts or audits. Tasks in other clinics do not block removal. Shared identities retain their global account, other clinic memberships and roles, and append users/membership_removed in this clinic. A single-clinic identity retains the Phase 1 account-deletion behavior. Clinic membership and tenant-local target binding are required; no platform authority is implied.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/roles:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Roles]
      summary: List roles with permissions
      description: Requires the actual admin role, including for reads. Permission wildcards alone do not grant access. Ordered by ID. See docs/roles.md and docs/audit-logging.md.
      responses:
        "200": { $ref: "#/components/responses/RoleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Roles]
      summary: Create a custom role
      description: Admin only. is_system is server-controlled and rejected in input, including null. Creation atomically appends a roles/created audit record without copying description or permission snapshots.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleCreateRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: role, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Roles]
      summary: Get role with permissions
      description: Admin only.
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Roles]
      summary: Partially update a role
      description: Admin only. Omitted fields are preserved. System-role slugs cannot change; is_system is prohibited. Changed writes atomically append roles/updated; no-op writes do not append records.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleUpdateRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Roles]
      summary: Update a role
      description: Same partial-update, admin-only authorization, protected system-role rules, and atomic audit behavior as PATCH.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleUpdateRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Roles]
      summary: Delete a custom role
      description: Admin only. System roles cannot be deleted. Removes role memberships and permission links atomically with a roles/deleted audit and users/roles_changed audits for affected users. Existing audit history is retained.
      responses:
        "200": { $ref: "#/components/responses/DeleteMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/permissions:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Roles]
      summary: List existing permissions for role assignment
      description: Admin-only selector ordered by slug. Does not create permission definitions or emit mutation audits.
      responses:
        "200": { $ref: "#/components/responses/PermissionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/roles/{role}/permissions:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: role, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Roles]
      summary: Replace a role's permissions
      description: Admin only. Empty array removes all permissions. Same assignments are a no-op. Changes append roles/permissions_changed atomically; descriptions and permission snapshots are not copied into audit storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids: { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
      responses:
        "200": { $ref: "#/components/responses/RoleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/users/{user}/roles:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Roles]
      summary: Replace a user's assigned roles
      description: Admin only. Empty array removes all roles, including the caller's own admin role if the caller is the target. Same assignments are a no-op. Changes append users/roles_changed with the performing admin as actor and edited user as resource. See docs/roles.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids: { type: array, uniqueItems: true, items: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Standard envelope with data.user including assigned roles and flattened permissions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { type: object, properties: { user: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/audit-logs:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Audit Logs]
      summary: List read-only audit history
      description: Requires the actual admin or auditor role slug; permission wildcards and audit_logs.view alone do not grant access. All supplied filters combine with AND. Ordered by occurred_at descending then ID descending. Deleted resource/user IDs remain queryable. Returns private, no-store data. Reads do not emit audit events. See docs/audit-log-frontend-guide.md.
      parameters:
        - name: actor_id
          in: query
          description: Filter by the performing user's ID, including deleted users. Incompatible with actor_is_null=1.
          schema: { type: integer, minimum: 1 }
        - name: actor_is_null
          in: query
          description: Use 1 for unattributed/system/unauthenticated actors or 0 for attributed actors; omit for both.
          schema: { type: integer, enum: [0, 1] }
        - name: action
          in: query
          schema: { type: string, maxLength: 80, pattern: '^[a-z][a-z0-9_.]*$' }
        - name: resource_type
          in: query
          schema: { type: string, maxLength: 80, pattern: '^[a-z][a-z0-9_]*$' }
        - name: resource_id
          in: query
          description: Exact canonical string key; combine with resource_type for one resource's history.
          schema: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        - name: request_id
          in: query
          description: Originating mutation request ID, not the current GET request ID.
          schema: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
        - name: from
          in: query
          description: Inclusive occurrence-time lower bound. Requires seconds and explicit timezone; optional 1-6 fractional digits. Normalized to UTC.
          schema: { type: string, format: date-time, example: '2026-10-18T00:00:00-05:00' }
        - name: to
          in: query
          description: Inclusive upper bound with explicit timezone, on/after from. Microsecond precision is supported.
          schema: { type: string, format: date-time, example: '2026-10-18T23:59:59.999999-05:00' }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200": { $ref: "#/components/responses/AuditLogList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/audit-logs/filters:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Audit Logs]
      summary: Get available audit filter options
      description: Admin/auditor only. Sorted unique actions and resource types found in stored history; not restricted by active list filters and not a fixed catalog. Empty history returns empty arrays. Response is private, no-store.
      responses:
        "200": { $ref: "#/components/responses/AuditLogFilters" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/audit-logs/{audit_log}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - { name: audit_log, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Audit Logs]
      summary: Get an audit record
      description: Admin/auditor only. Same safe row shape as the list, including nullable current actorName rather than a full user model. Does not require that the actor or resource still exist. Response is private, no-store. POST/PUT/PATCH/DELETE audit routes are not exposed.
      responses:
        "200": { $ref: "#/components/responses/AuditLogEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
