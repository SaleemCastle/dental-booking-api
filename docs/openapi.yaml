        dentist_id: { type: integer, example: 1 }
        treatment_id: { type: integer, nullable: true, example: 1 }
        room_id: { type: integer, nullable: true, example: 1 }
        chair_id: { type: integer, nullable: true, example: 1 }
        appointment_date_time: { type: string, format: date-time }
        appointment_type: { type: string, example: Cleaning }
        description: { type: string, example: Routine cleaning. }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        duration_minutes: { type: integer, example: 30 }
        patientName: { type: string, example: Jane Doe }
        dentistName: { type: string, example: Alex Rivera }
        treatmentName: { type: string, nullable: true, example: Cleaning }
        roomName: { type: string, nullable: true, example: Room 1 }
        chairName: { type: string, nullable: true, example: Chair 1 }
        patientId: { type: integer, description: Alias for patient_id }
        dentistId: { type: integer, description: Alias for dentist_id }
        treatmentId: { type: integer, nullable: true, description: Alias for treatment_id }
        roomId: { type: integer, nullable: true, description: Alias for room_id }
        chairId: { type: integer, nullable: true, description: Alias for chair_id }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        duration: { type: integer, example: 30 }
        appointmentStatus: { $ref: "#/components/schemas/AppointmentStatus" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        checked_in_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancellation_reason: { type: string, nullable: true }
    AppointmentRequest:
      type: object
      required: [description]
      allOf:
        - anyOf:
            - required: [patient_id]
            - required: [patientId]
        - anyOf:
            - required: [dentist_id]
            - required: [dentistId]
        - anyOf:
            - required: [appointment_date_time]
            - required: [startsAt]
        - anyOf:
            - required: [appointment_type]
            - required: [appointmentType]
      properties:
        patient_id: { type: integer, example: 1 }
        dentist_id: { type: integer, example: 1 }
        treatment_id: { type: integer, nullable: true, example: 1 }
        room_id: { type: integer, nullable: true, description: Optional exclusive room reservation. }
        chair_id: { type: integer, nullable: true, description: Optional chair reservation. Derives room_id when room_id is omitted. }
        appointment_date_time: { type: string, format: date-time }
        appointment_type: { type: string, maxLength: 255 }
        description: { type: string }
        status: { type: string, enum: [scheduled], default: scheduled }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        patientId: { type: integer, description: Frontend alias for patient_id }
        dentistId: { type: integer, description: Frontend alias for dentist_id }
        treatmentId: { type: integer, nullable: true, description: Frontend alias for treatment_id }
        roomId: { type: integer, nullable: true, description: Frontend alias for room_id }
        chairId: { type: integer, nullable: true, description: Frontend alias for chair_id }
        startsAt: { type: string, format: date-time, description: Frontend alias for appointment_date_time }
        appointmentType: { type: string, description: Frontend alias for appointment_type }
        durationMinutes: { type: integer, description: Frontend alias for duration_minutes }
        appointmentStatus: { type: string, enum: [scheduled], description: Frontend alias for status }
    AppointmentUpdateRequest:
      type: object
      description: Only supplied fields change. A newly selected treatment supplies duration_minutes when explicit duration is omitted; an unchanged treatment preserves the current duration. Active appointments revalidate provider availability when provider, start, duration, treatment, room, or chair changes. Availability failures return 422 under dentist_id and appointment_date_time without persisting changes. Notes and status-only changes preserve existing bookings after schedule edits. Existing overlap checks still apply to active saves. Same-status retries preserve workflow timestamps. cancellation_reason may only be supplied when the resulting status is cancelled.
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        treatment_id: { type: integer, nullable: true }
        room_id: { type: integer, nullable: true }
        chair_id: { type: integer, nullable: true }
        appointment_date_time: { type: string, format: date-time }
        appointment_type: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        cancellation_reason: { type: string, nullable: true, maxLength: 2000 }
        patientId: { type: integer }
        dentistId: { type: integer }
        treatmentId: { type: integer, nullable: true }
        roomId: { type: integer, nullable: true }
        chairId: { type: integer, nullable: true }
        startsAt: { type: string, format: date-time }
        appointmentType: { type: string }
        durationMinutes: { type: integer }
        appointmentStatus: { $ref: "#/components/schemas/AppointmentStatus" }
        reason: { type: string, nullable: true, maxLength: 2000, description: Alias for cancellation_reason }
    AppointmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                appointment: { $ref: "#/components/schemas/Appointment" }
    Invoice:
      type: object
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, example: 1 }
        appointment_id: { type: integer, nullable: true, example: 1 }
        invoice_number: { type: string, example: INV-1001 }
        amount_due: { type: string, example: "250.00" }
        amount_paid: { type: string, example: "100.00" }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        currency: { type: string, example: USD }
        balance: { type: string, example: "150.00" }
        items: { type: array, items: { $ref: "#/components/schemas/InvoiceItem" } }
        voided_at: { type: string, format: date-time, nullable: true }
        void_reason: { type: string, nullable: true }
        issued_at: { type: string, format: date-time, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    InvoiceRequest:
      type: object
      additionalProperties: false
      required: [patient_id, invoice_number, currency, items]
      properties:
        patient_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        invoice_number: { type: string, maxLength: 255 }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/InvoiceItemRequest" }
        due_date: { type: string, format: date, nullable: true }
    InvoiceUpdateRequest:
      type: object
      additionalProperties: false
      description: Draft number/due date edits, issue, or void with a nonblank reason. Snapshots and amounts are immutable. Issued invoices cannot change header fields. Invoices with payments cannot be voided.
      properties:
        invoice_number: { type: string, maxLength: 255 }
        status: { type: string, enum: [issued, void] }
        void_reason: { type: string, maxLength: 500, description: Required only when status is void. }
        due_date: { type: string, format: date, nullable: true }
    InvoiceStatus:
      type: string
      enum: [draft, issued, partially_paid, paid, void]
    InvoiceItem:
      type: object
      properties:
        id: { type: integer }
        treatment_id: { type: integer, nullable: true }
        treatment_plan_item_id: { type: integer, nullable: true }
        description: { type: string }
        quantity: { type: integer }
        unit_price: { type: string, example: "10.25" }
        line_total: { type: string, example: "20.50" }
    InvoiceItemRequest:
      type: object
      additionalProperties: false
      description: Choose exactly one source. Sourced items cannot supply description/unit_price. Custom items require both. Quantity defaults to 1.
      properties:
        treatment_id: { type: integer }
        treatment_plan_item_id: { type: integer }
        description: { type: string, maxLength: 255, example: Custom service }
        unit_price: { type: string, pattern: '^(0|[1-9][0-9]{0,7})(\.[0-9]{1,2})?$', example: "10.25" }
        quantity: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      oneOf:
        - required: [treatment_id]
        - required: [treatment_plan_item_id]
        - required: [description, unit_price]
    PaymentLink:
      type: object
      properties:
        id: { type: integer }
        invoice_id: { type: integer }
        provider: { type: string, example: handypay }
        external_reference: { type: string, nullable: true }
        checkout_url: { type: string, format: uri, nullable: true, description: HTTPS hosted URL exposed only while active. }
        expires_at: { type: string, format: date-time, nullable: true, description: Null when the provider does not supply expiry. }
        status: { type: string, enum: [creating, active, pending, completed, expired, cancelled, failed, unknown] }
        amount: { type: string, example: "75.00" }
        currency: { type: string, example: JMD }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: integer, example: 1 }
        invoice_id: { type: integer, example: 1 }
        amount: { type: string, example: "100.00" }
        currency: { type: string, example: USD }
        payment_method: { type: string, enum: [cash, bank_transfer, card, check, other] }
        status: { type: string, enum: [paid] }
        paid_at: { type: string, format: date-time, nullable: true }
        reference: { type: string, nullable: true }
        payment_link_id: { type: integer, nullable: true }
        provider_transaction_reference: { type: string, nullable: true }
        receipt_number: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true, description: Null only for historical payments predating the billing foundation. }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [invoice_id, amount, currency, payment_method, idempotency_key]
      properties:
        invoice_id: { type: integer }
        amount: { type: string, pattern: '^(0|[1-9][0-9]{0,7})(\.[0-9]{1,2})?$', example: "25.00", description: Must be positive and no greater than the remaining invoice balance. }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
        payment_method: { type: string, enum: [cash, bank_transfer, card, check, other] }
        idempotency_key: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$', example: receipt-2026-001 }
        paid_at: { type: string, format: date-time, description: Optional past or current timestamp; defaults to server time. }
        reference: { type: string, maxLength: 255, nullable: true }
        receipt_number: { type: string, maxLength: 255, nullable: true }
    TaskPriority:
      type: string
      enum: [low, normal, high, urgent]
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed, cancelled]
    TaskFields:
      type: object
      description: completed_at, created_at, and updated_at are server-controlled and must be absent, including null values. Linked appointments and patients must be consistent. Assignee must be an existing user; assignment does not grant task permissions.
      properties:
        patient_id: { type: integer, nullable: true }
        appointment_id: { type: integer, nullable: true }
        assignee_id: { type: integer }
        patient_reminder_at: { type: string, format: date-time, nullable: true, description: Explicit patient reminder time. Supplied nonnull values must be future times; requires a patient and an enabled tenant task.reminder rule. Null clears the reminder. }
        due_date: { type: string, format: date, example: "2026-10-20", description: Exact YYYY-MM-DD calendar date. Past dates are allowed. }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        description: { type: string, minLength: 1, maxLength: 16000 }
    TaskRequest:
      allOf:
        - $ref: "#/components/schemas/TaskFields"
        - type: object
          required: [assignee_id, due_date, description]
    Task:
      type: object
      required: [id, patient_id, appointment_id, assignee_id, due_date, priority, status, description, completed_at, patientName, assigneeName, appointmentStartsAt, is_overdue, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, nullable: true }
        appointment_id: { type: integer, nullable: true }
        assignee_id: { type: integer }
        patient_reminder_at: { type: string, format: date-time, nullable: true, description: Explicit patient reminder time. Supplied nonnull values must be future times; requires a patient and an enabled tenant task.reminder rule. Null clears the reminder. }
        due_date: { type: string, format: date, example: "2026-10-20" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        description: { type: string, example: Call patient after treatment. }
        completed_at: { type: string, format: date-time, nullable: true, readOnly: true }
        patientName: { type: string, nullable: true, readOnly: true }
        assigneeName: { type: string, readOnly: true }
        appointmentStartsAt: { type: string, format: date-time, nullable: true, readOnly: true }
        is_overdue: { type: boolean, readOnly: true, description: Open task with due_date strictly before the application's current calendar date. }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    ClinicalNote:
      type: object
      description: Canonical IDs are integers; dentist_id identifies the clinical provider independently of the authenticated author. Attribution is nullable only for legacy notes whose original authorship is unknown. API-created notes always capture author and editor. Response timestamps use ISO 8601 UTC.
      required: [id, patient_id, dentist_id, appointment_id, note_text, author_user_id, updated_by_user_id, authorName, updatedByName, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, example: 1 }
        dentist_id: { type: integer, example: 1 }
        appointment_id: { type: integer, nullable: true, example: 1 }
        note_text: { type: string, example: Patient reported sensitivity. }
        author_user_id: { type: integer, nullable: true, readOnly: true, description: Immutable authenticated author. Null for unattributed legacy notes. }
        updated_by_user_id: { type: integer, nullable: true, readOnly: true, description: Authenticated last editor. Initially the author for API-created notes. }
        authorName: { type: string, nullable: true, readOnly: true }
        updatedByName: { type: string, nullable: true, readOnly: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ClinicalNoteRequest:
      type: object
      description: author_user_id, updated_by_user_id, deleted_by_user_id, deleted_at, created_at, and updated_at must be absent, including null values. Provider and author are distinct identities. When appointment_id is supplied, the patient and provider must match that appointment.
      required: [patient_id, dentist_id, note_text]
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        note_text: { type: string, minLength: 1, maxLength: 16000 }
    ClinicalNoteUpdateRequest:
      type: object
      description: All fields are optional; omitted fields remain unchanged. Appointment may be explicitly cleared with null. Relationship checks use the merged record. Authorship, editor/deletion attribution, and timestamps are server-controlled and must be absent.
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        note_text: { type: string, minLength: 1, maxLength: 16000 }
    DashboardSummary:
      type: object
      required: [bookedToday, waitingRoom, treatmentsDone, unpaidInvoiceAmount, collectionRate, todayAppointments, staffWorklist]
      properties:
        bookedToday: { type: integer, example: 12 }
        waitingRoom: { type: integer, example: 3 }
        treatmentsDone: { type: integer, example: 8 }
        unpaidInvoiceAmount: { type: number, nullable: true, example: 1250.5, description: Null without invoice read access or when multiple currencies exist. Drafts and void invoices are excluded. }
        collectionRate: { type: number, nullable: true, example: 82.4 }
        billingTotals:
          type: array
          nullable: true
          description: Per-currency financial totals; null without invoice read access.
          items:
            type: object
            properties:
              currency: { type: string }
              unpaidInvoiceAmount: { type: number }
              collectionRate: { type: number }
        todayAppointments:
          type: array
          items: { $ref: "#/components/schemas/Appointment" }
        staffWorklist:
          type: array
          items:
            $ref: "#/components/schemas/StaffWorklistItem"
    StaffWorklistItem:
      type: object
      properties:
        dentistId: { type: integer, example: 1 }
        dentistName: { type: string, example: Alex Rivera }
        scheduled: { type: integer, example: 4 }
        checkedIn: { type: integer, example: 1 }
        completed: { type: integer, example: 3 }
    Permission:
      type: object
      description: Permission used by role-based policies and frontend navigation gating.
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: View patients }
        slug: { type: string, example: patients.view }
        resource: { type: string, nullable: true, example: patients }
        action: { type: string, nullable: true, example: view }
        description: { type: string, nullable: true, example: Allows viewing patient records. }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    Role:
      type: object
      description: Clinic-local role assigned to members of that clinic. Slugs are unique within a clinic. The admin slug is Clinic Admin, never Platform Super Admin. Permission definitions are shared, but grants belong to this clinic's role. Client-supplied tenant_id is rejected.
      properties:
        tenant_id: { type: integer, readOnly: true, description: Owning clinic; cannot be supplied by clients. }
        id: { type: integer, example: 1 }
        name: { type: string, example: Clinic Admin }
        slug: { type: string, example: clinic-admin }
        description: { type: string, nullable: true, example: Can manage clinic operations. }
        is_system: { type: boolean, example: true }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Test User }
        email: { type: string, format: email, example: test@example.com }
        email_verified_at: { type: string, format: date-time, nullable: true }
        current_tenant_id: { type: integer, description: Present on GET /api/user. The selected clinic after authentication and membership verification. }
        roles:
          type: array
          description: Present on authenticated user responses and any user payload loaded with access data.
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: Flattened permission slugs derived only from roles in the selected clinic. Membership is required and no grants carry across clinics.
          items: { type: string }
          example: [patients.view, appointments.create]
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ProvisionTenantRequest:
      type: object
      required: [idempotency_key, name, slug, contact_email, timezone, currency, admin]
      properties:
        idempotency_key: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 100, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        contact_email: { type: string, format: email, maxLength: 255 }
        contact_phone: { type: string, maxLength: 50, nullable: true }
        address: { type: string, maxLength: 1000, nullable: true }
        timezone: { type: string, example: America/Bogota }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: COP }
        branding: { $ref: "#/components/schemas/TenantBranding" }
        admin:
          type: object
          additionalProperties: false
          required: [name, email, password]
          properties:
            name: { type: string, maxLength: 255 }
            email: { type: string, format: email, maxLength: 255 }
            password: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 72 }
    TenantBranding:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 255, nullable: true }
        logo_url: { type: string, format: uri, maxLength: 2048, nullable: true, description: HTTPS URL; backend never fetches it. }
        primary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true }
    Tenant:
      type: object
      required: [id, name, slug, active]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Default Clinic }
        slug: { type: string, example: default-clinic }
        active: { type: boolean, example: true }
        status: { type: string, enum: [active, suspended], readOnly: true }
        contact_email: { type: string, format: email, nullable: true }
        contact_phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        timezone: { type: string, example: America/Bogota }
        currency: { type: string, example: COP }
        branding: { $ref: "#/components/schemas/TenantBranding" }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    AppointmentStatus:
      type: string
      enum: [scheduled, checked_in, in_progress, completed, cancelled, no_show]
      example: scheduled
    ClinicNotification:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        invoice_id: { type: integer, nullable: true }
        patient_id: { type: integer, nullable: true }
        appointment_id: { type: integer, nullable: true }
        task_id: { type: integer, nullable: true }
        source_revision: { type: integer, nullable: true }
        payment_id: { type: integer, nullable: true }
        payment_link_id: { type: integer, nullable: true }
        event: { type: string, enum: [payment.recorded, payment_link.created, payment_link.failed, payment_link.expired, appointment.confirmed, appointment.reminder, appointment.cancelled, appointment.rescheduled, task.reminder] }
        event_key: { type: string }
        actor_id: { type: integer, nullable: true }
        user_triggered: { type: boolean }
        trigger: { type: string, enum: [staff, payment_provider, staff_create, staff_update] }
        selection_status: { type: string, enum: [queued, no_eligible_recipients] }
        deliveries:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              channel: { type: string, enum: [email, sms] }
              recipient_kind: { type: string, enum: [patient, billing_copy, internal_copy] }
              status: { type: string, enum: [pending, processing, retry, accepted, delivered, failed, suppressed, unknown] }
              attempts: { type: integer }
              failure_reason: { type: string, nullable: true }
              provider_reference: { type: string, nullable: true }
              available_at: { type: string, format: date-time }
              attempted_at: { type: string, format: date-time, nullable: true }
              accepted_at: { type: string, format: date-time, nullable: true }
    PaymentStatus:
      type: string
      description: Appointment projection uses unpaid when no invoice exists; otherwise the invoice lifecycle status.
      enum: [unpaid, draft, issued, partially_paid, paid, void]
      example: unpaid
    InsuranceRemittanceAmounts:
      type: object
      additionalProperties: false
      description: Insurer-reported informational totals. Omitted or null means the source did not provide a value; totals are not recalculated or reconciled.
      properties:
        billed: { type: string, nullable: true, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$', example: '125.00' }
        allowed: { type: string, nullable: true, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$', example: '100.00' }
        paid: { type: string, nullable: true, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$', example: '80.00' }
        denied: { type: string, nullable: true, pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$', example: '20.00' }
        adjusted: { type: string, nullable: true, pattern: '^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$', example: '-5.00', description: Signed insurer-reported adjustment; not a posted accounting adjustment. }
