                      dentists: { type: array, items: { $ref: "#/components/schemas/Dentist" } }
    DentistEnvelope:
      description: Dentist envelope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      dentist: { $ref: "#/components/schemas/Dentist" }
    TreatmentList:
      description: Treatment list.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      treatments: { type: array, items: { $ref: "#/components/schemas/Treatment" } }
    TreatmentEnvelope:
      description: Treatment envelope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
