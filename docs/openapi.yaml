  /api/inventory/movements:
    parameters:
      - { $ref: "#/components/parameters/TenantHeader" }
    get:
      tags: [Inventory]
      summary: List movements
      description: Requires inventory.view.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
        - { name: item_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: location_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: lot_id, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Paginated movements in the standard response envelope.
          content:
