  schemas:
    AuditLog:
      type: object
      required: [id, actor_id, actorName, action, resource_type, resource_id, occurred_at, ip_address, user_agent, request_metadata]
      description: Read-only audit record with the current actor display name. No clinical content, emails, credentials, full user models, or before/after snapshots are exposed. Resource IDs are strings and do not imply access to the underlying resource.
      properties:
        id: { type: integer, readOnly: true }
        actor_id: { type: integer, nullable: true }
        actorName: { type: string, nullable: true, description: 'Current name, not a historical snapshot. Null when actor is unattributed or deleted.' }
        action: { type: string, maxLength: 80, example: updated }
        resource_type: { type: string, maxLength: 80, example: patients }
        resource_id: { type: string, maxLength: 128, example: '42' }
        occurred_at: { type: string, format: date-time, example: '2026-10-18T14:30:12.123456Z' }
        ip_address: { type: string, nullable: true, maxLength: 45 }
        user_agent: { type: string, nullable: true, maxLength: 512 }
        request_metadata:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            request_id: { type: string, description: 'Original mutation request ID, not the enclosing GET requestId.' }
            method: { type: string }
            route: { type: string, description: 'Route template without expanded parameters or query string.' }
    RoleCreateRequest:
      allOf:
        - $ref: "#/components/schemas/RoleUpdateRequest"
        - type: object
          required: [name, slug]
    RoleUpdateRequest:
      type: object
      description: Only name, slug, and description are writable. is_system is prohibited, even when null.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        slug: { type: string, minLength: 1, maxLength: 255, pattern: '^[a-z][a-z0-9_-]*$' }
        description: { type: string, nullable: true, maxLength: 1000 }
    ApiEnvelope:
      type: object
      required: [success, statusCode, message, code, data, errors, meta, requestId]
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string, example: OK }
        code: { type: string, nullable: true, example: null }
        data:
          nullable: true
          oneOf:
            - type: object
            - type: array
        errors: { type: object, nullable: true, example: null }
        meta:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/PaginationMeta"
            - type: object
        requestId: { type: string, nullable: true, example: 018fe4f3-8b34-7cc9-9f3f-b37a2d5f7c6e }
    ApiErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            success: { type: boolean, example: false }
            data: { nullable: true, example: null }
            errors:
              nullable: true
              type: object
    PaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            currentPage: { type: integer, example: 1 }
            perPage: { type: integer, example: 15 }
            total: { type: integer, example: 100 }
            lastPage: { type: integer, example: 7 }
            from: { type: integer, nullable: true, example: 1 }
            to: { type: integer, nullable: true, example: 15 }
            hasMorePages: { type: boolean, example: true }
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: Laravel }
        timestamp: { type: string, format: date-time }
    LoginRequest:
