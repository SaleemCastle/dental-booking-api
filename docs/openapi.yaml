  /api/tasks:
    get:
      tags: [Tasks]
      summary: List follow-up tasks
      description: Requires tasks.view permission or the admin role. Filters combine with AND before pagination. assigned_to_me uses the authenticated user's ID. overdue and due_today include only pending/in_progress tasks and use the application's calendar date (UTC). Boolean query toggles accept 1 or 0; 0 disables a filter. Without date filters, all task statuses are included. Results are ordered by due_date ascending then ID ascending. See docs/tasks.md.
      parameters:
        - name: assigned_to_me
          in: query
          schema: { type: integer, enum: [0, 1] }
        - name: overdue
          in: query
          description: Open tasks with due_date strictly before today.
          schema: { type: integer, enum: [0, 1] }
        - name: due_today
          in: query
          description: Open tasks with due_date equal to today.
          schema: { type: integer, enum: [0, 1] }
        - name: patient_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Tasks]
      summary: Create follow-up task
      description: Requires tasks.create permission or the admin role. Assignee, due_date, and description are required. Patient and appointment are optional. An appointment derives patient_id when patient_id is omitted; an explicitly supplied patient must match the appointment. Due dates may be in the past. Priority defaults to normal and status to pending. Any valid initial status is accepted; completed tasks receive a server-generated completed_at timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "201":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/tasks/{task}:
    parameters:
      - name: task
        in: path
        required: true
        schema: { type: integer, example: 1 }
    get:
      tags: [Tasks]
      summary: Get follow-up task
      description: Requires tasks.view permission or the admin role. Assignment alone grants no access.
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      summary: Update or reassign follow-up task
      description: Requires tasks.update permission or the admin role. Preserves omitted fields. Changing appointment_id without patient_id derives the new appointment's patient. Clearing appointment_id keeps the patient; clear both IDs to make a general task. Relationship mismatches return 422. Any valid status change is allowed, including reopening a completed/cancelled task. completed_at is generated on completion, preserved on repeated completion, and cleared when leaving completed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFields" }
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Tasks]
      summary: Update follow-up task
      description: Uses the same partial update, tasks.update authorization, relationship checks, and completion timestamp behavior as PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFields" }
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Tasks]
      summary: Delete follow-up task
      description: Requires tasks.delete permission or the admin role. Physically deletes the task. Use status cancelled to retain it instead. Subsequent requests for the deleted ID return 404.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks/{task}/status:
    parameters:
      - name: task
        in: path
        required: true
        schema: { type: integer, example: 1 }
    patch:
      tags: [Tasks]
      summary: Change follow-up task status
      description: Requires tasks.update permission or the admin role. Accepts any valid status, including reopening. Other task fields and server-managed timestamps must be absent. Uses the same completion timestamp behavior as the general update endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          $ref: "#/components/responses/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/clinical-notes:
    get:
      tags: [Clinical Notes]
      summary: List clinical notes
      description: Admins and dentists can read clinic notes. Other users require clinical_notes.view (wildcards supported for reads). Soft-deleted notes are excluded. Results are ordered by created_at descending, then ID descending, with meta.pagination. See docs/clinical-notes.md for clinical-role and audit integration rules.
      parameters:
        - name: patient_id
          in: query
          schema: { type: integer }
        - name: dentist_id
          in: query
          description: Filter by provider ID.
          schema: { type: integer }
        - name: appointment_id
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Clinical Notes]
      summary: Create clinical note
      description: Requires the admin role or the dentist role without the receptionist role. Permissions and wildcards alone cannot grant clinical writes. Appointment is optional; when present, its patient and provider must match the supplied patient_id and dentist_id. The authenticated user becomes author and last editor. Client-supplied attribution, deletion fields, and timestamps are rejected. Appointment status and patient archival do not prevent clinical documentation.
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteBody"
      responses:
        "201":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/clinical-notes/{clinical_note}:
    parameters:
      - $ref: "#/components/parameters/ClinicalNoteId"
    get:
      tags: [Clinical Notes]
      summary: Get clinical note
      description: Uses the same read authorization as the clinical note list. Soft-deleted notes return 404.
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Clinical Notes]
      summary: Update clinical note
      description: Requires the admin role or the dentist role without the receptionist role. Dentists may collaborate on clinic notes; authorship remains immutable and changed notes capture the authenticated last editor. Omitted fields are preserved. Relationship validation checks the merged note and appointment. Explicit appointment_id null detaches the appointment. Changes publish an after-commit ClinicalNoteChanged event with actor and before/after snapshots; no-op updates preserve metadata and publish no event.
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Clinical Notes]
      summary: Update clinical note
      description: Uses the same partial update, clinical-role authorization, immutable authorship, relationship validation, and audit event behavior as PATCH.
      requestBody:
        $ref: "#/components/requestBodies/ClinicalNoteUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/ClinicalNoteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Clinical Notes]
      summary: Delete clinical note
      description: Requires the admin role or the dentist role without the receptionist role. Soft-deletes the note, retaining its contents, author, editor, deleted_by_user_id, and deleted_at for audit integration. Publishes an after-commit ClinicalNoteChanged event. Subsequent show, update, or delete requests return 404.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
