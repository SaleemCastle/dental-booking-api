  responses:
    AuditLogList:
      description: Standard envelope with data.auditLogs and meta.pagination. Empty lists have total 0 and null from/to.
      headers:
        Cache-Control: { schema: { type: string }, description: 'private, no-store' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { type: object, properties: { auditLogs: { type: array, items: { $ref: "#/components/schemas/AuditLog" } } } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    AuditLogEnvelope:
      description: Standard envelope with data.auditLog and null meta.
      headers:
        Cache-Control: { schema: { type: string }, description: 'private, no-store' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { type: object, properties: { auditLog: { $ref: "#/components/schemas/AuditLog" } } }
    AuditLogFilters:
