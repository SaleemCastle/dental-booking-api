        last_name: { type: string, example: Rivera }
        name: { type: string, example: Alex Rivera }
        email: { type: string, format: email, example: alex@example.com }
        contact_number: { type: string, example: "+15551234567" }
        specialization: { type: string, nullable: true, example: Orthodontics }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    DentistRequest:
      type: object
      required: [first_name, last_name, email, contact_number]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        contact_number: { type: string, maxLength: 255 }
        specialization: { type: string, nullable: true, maxLength: 255 }
    DentistUpdateRequest:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        contact_number: { type: string, maxLength: 255 }
        specialization: { type: string, nullable: true, maxLength: 255 }
    Treatment:
      type: object
      description: Existing treatments receive category Uncategorized and active true when the catalog migration is applied. Inactive treatments remain linked to historical appointments.
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Cleaning }
        description: { type: string, nullable: true }
        category: { type: string, maxLength: 100, example: Preventive }
        duration_minutes: { type: integer, example: 30 }
        price: { type: string, example: "125.00" }
        active: { type: boolean, example: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    TreatmentRequest:
      type: object
      required: [name, category, duration_minutes, price]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        category: { type: string, minLength: 1, maxLength: 100 }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: A nonnegative amount with at most two decimal places. Numeric strings are also accepted. }
        active: { type: boolean, default: true }
    TreatmentUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        category: { type: string, minLength: 1, maxLength: 100 }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        price: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: A nonnegative amount with at most two decimal places. Numeric strings are also accepted. }
        active: { type: boolean }
    AppointmentRoom:
      type: object
      required: [id, name, chairs]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Room 1 }
        chairs:
          type: array
          items:
            type: object
            required: [id, room_id, name]
            properties:
              id: { type: integer, example: 1 }
              room_id: { type: integer, example: 1 }
              name: { type: string, example: Chair 1 }
    Appointment:
      type: object
      description: Snake_case IDs are canonical integer database identifiers. CamelCase ID fields are equivalent compatibility aliases. The provider is identified by dentist_id. All date-time response fields use ISO 8601 UTC. Location IDs and names are null for unassigned legacy appointments.
      required: [id, patient_id, dentist_id, treatment_id, room_id, chair_id, appointment_date_time, duration_minutes, status, patientName, dentistName, treatmentName, roomName, chairName, startsAt, endsAt, cancellation_reason]
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, example: 1 }
        dentist_id: { type: integer, example: 1 }
        treatment_id: { type: integer, nullable: true, example: 1 }
        room_id: { type: integer, nullable: true, example: 1 }
        chair_id: { type: integer, nullable: true, example: 1 }
        appointment_date_time: { type: string, format: date-time }
        appointment_type: { type: string, example: Cleaning }
        description: { type: string, example: Routine cleaning. }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        duration_minutes: { type: integer, example: 30 }
        patientName: { type: string, example: Jane Doe }
        dentistName: { type: string, example: Alex Rivera }
        treatmentName: { type: string, nullable: true, example: Cleaning }
        roomName: { type: string, nullable: true, example: Room 1 }
        chairName: { type: string, nullable: true, example: Chair 1 }
        patientId: { type: integer, description: Alias for patient_id }
        dentistId: { type: integer, description: Alias for dentist_id }
        treatmentId: { type: integer, nullable: true, description: Alias for treatment_id }
        roomId: { type: integer, nullable: true, description: Alias for room_id }
        chairId: { type: integer, nullable: true, description: Alias for chair_id }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        duration: { type: integer, example: 30 }
        appointmentStatus: { $ref: "#/components/schemas/AppointmentStatus" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        checked_in_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancellation_reason: { type: string, nullable: true }
    AppointmentRequest:
      type: object
      required: [description]
      allOf:
        - anyOf:
            - required: [patient_id]
            - required: [patientId]
        - anyOf:
            - required: [dentist_id]
            - required: [dentistId]
        - anyOf:
            - required: [appointment_date_time]
            - required: [startsAt]
        - anyOf:
            - required: [appointment_type]
            - required: [appointmentType]
      properties:
        patient_id: { type: integer, example: 1 }
        dentist_id: { type: integer, example: 1 }
        treatment_id: { type: integer, nullable: true, example: 1 }
        room_id: { type: integer, nullable: true, description: Optional exclusive room reservation. }
        chair_id: { type: integer, nullable: true, description: Optional chair reservation. Derives room_id when room_id is omitted. }
        appointment_date_time: { type: string, format: date-time }
        appointment_type: { type: string, maxLength: 255 }
        description: { type: string }
        status: { type: string, enum: [scheduled], default: scheduled }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        patientId: { type: integer, description: Frontend alias for patient_id }
        dentistId: { type: integer, description: Frontend alias for dentist_id }
        treatmentId: { type: integer, nullable: true, description: Frontend alias for treatment_id }
        roomId: { type: integer, nullable: true, description: Frontend alias for room_id }
        chairId: { type: integer, nullable: true, description: Frontend alias for chair_id }
        startsAt: { type: string, format: date-time, description: Frontend alias for appointment_date_time }
        appointmentType: { type: string, description: Frontend alias for appointment_type }
        durationMinutes: { type: integer, description: Frontend alias for duration_minutes }
        appointmentStatus: { type: string, enum: [scheduled], description: Frontend alias for status }
    AppointmentUpdateRequest:
      type: object
      description: Only supplied fields change. A newly selected treatment supplies duration_minutes when explicit duration is omitted; an unchanged treatment preserves the current duration. Same-status retries preserve workflow timestamps. cancellation_reason may only be supplied when the resulting status is cancelled.
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        treatment_id: { type: integer, nullable: true }
        room_id: { type: integer, nullable: true }
        chair_id: { type: integer, nullable: true }
        appointment_date_time: { type: string, format: date-time }
        appointment_type: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        cancellation_reason: { type: string, nullable: true, maxLength: 2000 }
        patientId: { type: integer }
        dentistId: { type: integer }
        treatmentId: { type: integer, nullable: true }
        roomId: { type: integer, nullable: true }
        chairId: { type: integer, nullable: true }
        startsAt: { type: string, format: date-time }
        appointmentType: { type: string }
        durationMinutes: { type: integer }
        appointmentStatus: { $ref: "#/components/schemas/AppointmentStatus" }
        reason: { type: string, nullable: true, maxLength: 2000, description: Alias for cancellation_reason }
    AppointmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                appointment: { $ref: "#/components/schemas/Appointment" }
    Invoice:
      type: object
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, example: 1 }
        appointment_id: { type: integer, nullable: true, example: 1 }
        invoice_number: { type: string, example: INV-1001 }
        amount_due: { type: string, example: "250.00" }
        amount_paid: { type: string, example: "100.00" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        issued_at: { type: string, format: date-time, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    InvoiceRequest:
      type: object
      required: [patient_id, invoice_number, amount_due, status]
      properties:
        patient_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        invoice_number: { type: string }
        amount_due: { type: number, minimum: 0 }
        amount_paid: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        issued_at: { type: string, format: date-time, nullable: true }
        due_date: { type: string, format: date, nullable: true }
    InvoiceUpdateRequest:
      type: object
      properties:
        patient_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        invoice_number: { type: string }
        amount_due: { type: number, minimum: 0 }
        amount_paid: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        issued_at: { type: string, format: date-time, nullable: true }
        due_date: { type: string, format: date, nullable: true }
    Payment:
      type: object
      properties:
        id: { type: integer, example: 1 }
        invoice_id: { type: integer, example: 1 }
        amount: { type: string, example: "100.00" }
        payment_method: { type: string, nullable: true, example: card }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        paid_at: { type: string, format: date-time, nullable: true }
        reference: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    PaymentRequest:
      type: object
      required: [invoice_id, amount, status]
      properties:
        invoice_id: { type: integer }
        amount: { type: number, minimum: 0 }
        payment_method: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        paid_at: { type: string, format: date-time, nullable: true }
        reference: { type: string, nullable: true }
    PaymentUpdateRequest:
      type: object
      properties:
        invoice_id: { type: integer }
        amount: { type: number, minimum: 0 }
        payment_method: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        paid_at: { type: string, format: date-time, nullable: true }
        reference: { type: string, nullable: true }
    TaskPriority:
      type: string
      enum: [low, normal, high, urgent]
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed, cancelled]
    TaskFields:
      type: object
      description: completed_at, created_at, and updated_at are server-controlled and must be absent, including null values. Linked appointments and patients must be consistent. Assignee must be an existing user; assignment does not grant task permissions.
      properties:
        patient_id: { type: integer, nullable: true }
        appointment_id: { type: integer, nullable: true }
        assignee_id: { type: integer }
        due_date: { type: string, format: date, example: "2026-10-20", description: Exact YYYY-MM-DD calendar date. Past dates are allowed. }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        description: { type: string, minLength: 1, maxLength: 16000 }
    TaskRequest:
      allOf:
        - $ref: "#/components/schemas/TaskFields"
        - type: object
          required: [assignee_id, due_date, description]
    Task:
      type: object
      required: [id, patient_id, appointment_id, assignee_id, due_date, priority, status, description, completed_at, patientName, assigneeName, appointmentStartsAt, is_overdue, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, nullable: true }
        appointment_id: { type: integer, nullable: true }
        assignee_id: { type: integer }
        due_date: { type: string, format: date, example: "2026-10-20" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        description: { type: string, example: Call patient after treatment. }
        completed_at: { type: string, format: date-time, nullable: true, readOnly: true }
        patientName: { type: string, nullable: true, readOnly: true }
        assigneeName: { type: string, readOnly: true }
        appointmentStartsAt: { type: string, format: date-time, nullable: true, readOnly: true }
        is_overdue: { type: boolean, readOnly: true, description: Open task with due_date strictly before the application's current calendar date. }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    ClinicalNote:
      type: object
      description: Canonical IDs are integers; dentist_id identifies the clinical provider independently of the authenticated author. Attribution is nullable only for legacy notes whose original authorship is unknown. API-created notes always capture author and editor. Response timestamps use ISO 8601 UTC.
      required: [id, patient_id, dentist_id, appointment_id, note_text, author_user_id, updated_by_user_id, authorName, updatedByName, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        patient_id: { type: integer, example: 1 }
        dentist_id: { type: integer, example: 1 }
        appointment_id: { type: integer, nullable: true, example: 1 }
        note_text: { type: string, example: Patient reported sensitivity. }
        author_user_id: { type: integer, nullable: true, readOnly: true, description: Immutable authenticated author. Null for unattributed legacy notes. }
        updated_by_user_id: { type: integer, nullable: true, readOnly: true, description: Authenticated last editor. Initially the author for API-created notes. }
        authorName: { type: string, nullable: true, readOnly: true }
        updatedByName: { type: string, nullable: true, readOnly: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ClinicalNoteRequest:
      type: object
      description: author_user_id, updated_by_user_id, deleted_by_user_id, deleted_at, created_at, and updated_at must be absent, including null values. Provider and author are distinct identities. When appointment_id is supplied, the patient and provider must match that appointment.
      required: [patient_id, dentist_id, note_text]
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        note_text: { type: string, minLength: 1, maxLength: 16000 }
    ClinicalNoteUpdateRequest:
      type: object
      description: All fields are optional; omitted fields remain unchanged. Appointment may be explicitly cleared with null. Relationship checks use the merged record. Authorship, editor/deletion attribution, and timestamps are server-controlled and must be absent.
      properties:
        patient_id: { type: integer }
        dentist_id: { type: integer }
        appointment_id: { type: integer, nullable: true }
        note_text: { type: string, minLength: 1, maxLength: 16000 }
    DashboardSummary:
      type: object
      required: [bookedToday, waitingRoom, treatmentsDone, unpaidInvoiceAmount, collectionRate, todayAppointments, staffWorklist]
      properties:
        bookedToday: { type: integer, example: 12 }
        waitingRoom: { type: integer, example: 3 }
        treatmentsDone: { type: integer, example: 8 }
        unpaidInvoiceAmount: { type: number, example: 1250.5 }
        collectionRate: { type: number, example: 82.4 }
        todayAppointments:
          type: array
          items: { $ref: "#/components/schemas/Appointment" }
        staffWorklist:
          type: array
          items:
            $ref: "#/components/schemas/StaffWorklistItem"
    StaffWorklistItem:
      type: object
      properties:
        dentistId: { type: integer, example: 1 }
        dentistName: { type: string, example: Alex Rivera }
        scheduled: { type: integer, example: 4 }
        checkedIn: { type: integer, example: 1 }
        completed: { type: integer, example: 3 }
    Permission:
      type: object
      description: Permission used by role-based policies and frontend navigation gating.
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: View patients }
        slug: { type: string, example: patients.view }
        resource: { type: string, nullable: true, example: patients }
        action: { type: string, nullable: true, example: view }
        description: { type: string, nullable: true, example: Allows viewing patient records. }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    Role:
      type: object
      description: Clinic-local role assigned to members of that clinic. Slugs are unique within a clinic. The admin slug is Clinic Admin, never Platform Super Admin. Permission definitions are shared, but grants belong to this clinic's role. Client-supplied tenant_id is rejected.
      properties:
        tenant_id: { type: integer, readOnly: true, description: Owning clinic; cannot be supplied by clients. }
        id: { type: integer, example: 1 }
        name: { type: string, example: Clinic Admin }
        slug: { type: string, example: clinic-admin }
        description: { type: string, nullable: true, example: Can manage clinic operations. }
        is_system: { type: boolean, example: true }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Test User }
        email: { type: string, format: email, example: test@example.com }
        email_verified_at: { type: string, format: date-time, nullable: true }
        current_tenant_id: { type: integer, description: Present on GET /api/user. The selected clinic after authentication and membership verification. }
        roles:
          type: array
          description: Present on authenticated user responses and any user payload loaded with access data.
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: Flattened permission slugs derived only from roles in the selected clinic. Membership is required and no grants carry across clinics.
          items: { type: string }
          example: [patients.view, appointments.create]
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    Tenant:
      type: object
      required: [id, name, slug, active]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Default Clinic }
        slug: { type: string, example: default-clinic }
        active: { type: boolean, example: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    AppointmentStatus:
      type: string
      enum: [scheduled, checked_in, in_progress, completed, cancelled, no_show]
      example: scheduled
    PaymentStatus:
      type: string
      enum: [unpaid, partial, paid, refunded]
      example: unpaid
