        priority: { type: string, enum: [low, normal, high, urgent] }
        sequence: { type: integer }
        tooth_context:
          allOf:
            - $ref: "#/components/schemas/TreatmentPlanToothContext"
            - properties:
                numbering_system: { type: string, enum: [fdi], default: fdi }
