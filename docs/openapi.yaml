        by_current_status: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    InsuranceReportOutcomeCounts:
      type: object
      required: [by_outcome]
      properties:
        by_outcome: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    InsuranceReportSourceCounts:
      type: object
      required: [by_source]
      properties:
        by_source: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    AvailabilityPeriod:
      type: object
      additionalProperties: false
      required: [start_time, end_time]
      properties:
        start_time: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', example: "09:00" }
        end_time: { type: string, pattern: '^(?:(?:[01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', example: "17:00" }
    WeeklyAvailabilityPeriod:
      type: object
      additionalProperties: false
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week: { type: integer, minimum: 0, maximum: 6, example: 2, description: "0 Sunday through 6 Saturday." }
        start_time: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', example: "09:00" }
        end_time: { type: string, pattern: '^(?:(?:[01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', example: "17:00" }
    ProviderAvailabilityRequest:
      type: object
      description: Complete replacement. All lists are required and may be empty. Ownership, timezone, and configured state are server-controlled. Interval objects only accept documented fields; dates must be unique. Every end must be later than its start.
      required: [weekly_hours, breaks, exceptions]
      properties:
        weekly_hours:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/WeeklyAvailabilityPeriod" }
        breaks:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/WeeklyAvailabilityPeriod" }
        exceptions:
          type: array
          maxItems: 366
          items:
            type: object
            additionalProperties: false
            required: [date, working_hours, breaks]
            properties:
              date: { type: string, format: date, example: "2026-11-03" }
              working_hours:
                type: array
                maxItems: 24
                description: Replaces the weekly working hours for this date. Empty means a day off.
                items: { $ref: "#/components/schemas/AvailabilityPeriod" }
              breaks:
                type: array
                maxItems: 24
                description: Replaces the recurring breaks for this date.
                items: { $ref: "#/components/schemas/AvailabilityPeriod" }
    PatientDocument:
      type: object
