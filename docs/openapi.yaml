        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
        archived_by_user_id: { type: integer, nullable: true }
    TreatmentPlanToothContext:
      type: object
      nullable: true
      additionalProperties: false
      required: [dentition, tooth]
      description: Optional context, using odontogram numbering and surface rules. Default input numbering is Universal; stored/returned context always has numbering_system fdi. Omit surfaces or use [] for a whole tooth. F/P aliases normalize to B/L; duplicate normalized surfaces are rejected.
      properties:
        dentition: { type: string, enum: [adult, primary] }
        numbering_system: { type: string, enum: [universal, fdi], default: universal }
        tooth:
          oneOf:
            - { type: string }
            - { type: integer }
          example: "3"
        surfaces:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [M, D, B, L, O, I, F, P] }
    TreatmentPlanItemFields:
      type: object
      properties:
        dentist_id: { type: integer, minimum: 1 }
        tooth_context: { $ref: "#/components/schemas/TreatmentPlanToothContext" }
        estimated_price:
          description: Editable estimate, defaults to the captured catalog price on addition. Maximum two decimal places; responses are fixed two-decimal strings.
          oneOf:
            - { type: string, pattern: '^[0-9]{1,8}(\.[0-9]{1,2})?$' }
            - { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
          example: "125.50"
        sequence: { type: integer, minimum: 1, maximum: 1000000, description: Omit on addition to append. Ties resolve by item ID. }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        notes: { type: string, nullable: true, maxLength: 10000 }
    CreateTreatmentPlanItem:
      allOf:
        - $ref: "#/components/schemas/TreatmentPlanItemFields"
        - type: object
          required: [treatment_id, dentist_id]
          properties:
            treatment_id: { type: integer, minimum: 1, description: Active catalog procedure in the selected clinic. }
    UpdateTreatmentPlanItem:
      allOf:
        - $ref: "#/components/schemas/TreatmentPlanItemFields"
        - type: object
          properties:
            status: { type: string, enum: [proposed, in_progress, completed, cancelled] }
    CreateTreatmentPlan:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255, example: Initial restorative care }
        notes: { type: string, nullable: true, maxLength: 10000 }
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/CreateTreatmentPlanItem" } }
    UpdateTreatmentPlan:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
