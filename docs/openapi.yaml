openapi: 3.0.3
info:
  title: Dental Booking Backend API
  version: 2.0.0
  description: Laravel Sanctum API for dental clinics. Each tenant is one clinic. Authenticated clinic requests optionally select X-Tenant-Id; omission selects the migrated default clinic, never another membership. Current membership and an active clinic are required. Clinical data, roles, permission grants, selectors, aggregates and audit history are clinic-scoped. Users and permission definitions are global; role assignments are clinic-local. Clinic Admin (admin) is not a Platform Super Admin. No SaaS onboarding is exposed. See docs/multi-tenancy.md. All JSON endpoints return the standard ApiEnvelope shape with success, statusCode, message, code, data, errors, meta, and requestId.
servers:
  - url: http://localhost:8000
    description: Local Laravel server
security:
  - sanctumBearer: []
tags:
  - name: Auth
  - name: Health
  - name: Dashboard
  - name: Patients
  - name: Appointments
  - name: Dentists
  - name: Treatments
  - name: Invoices
  - name: Payments
  - name: Clinical Notes
  - name: Tasks
  - name: Messages
  - name: Referrals
  - name: Users
  - name: Roles
  - name: Audit Logs
  - name: Tenants
paths:
  /api/tenants:
    get:
      tags: [Tenants]
      summary: List current user's active clinic memberships
      description: Requires Sanctum authentication but not a selected clinic. Returns only the caller's active memberships, enabling clinic discovery before X-Tenant-Id selection. Does not create clinics, enroll users, or confer platform privileges. Changing clinic requires refetching current-user roles/permissions and clearing clinic-specific frontend state. Unsupported tenant IDs return 403 on clinic endpoints; malformed IDs return 422. Foreign resource IDs return 404.
      responses:
        "200":
          description: Standard envelope with data.tenants ordered by ID.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tenants:
                            type: array
                            items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /sanctum/csrf-cookie:
    get:
      tags: [Auth]
      summary: Initialize CSRF and session cookies for browser clients
      description: Browser clients should call this endpoint with credentials enabled before posting to /login or /register.
      security: []
      responses:
        "200":
          description: CSRF and session cookies were queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { nullable: true, example: null }
  /login:
    post:
      tags: [Auth]
      summary: Log in with a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User authenticated and session regenerated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "409":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /register:
    post:
      tags: [Auth]
      summary: Register and log in with a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created, authenticated, and session regenerated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "409":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /logout:
    post:
      tags: [Auth]
      summary: Log out of the current browser session
      security:
        - sanctumCookie: []
      responses:
        "200":
          description: User logged out and session invalidated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HealthResponse" }
  /api/user:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Users]
      summary: Get authenticated user
      description: Requires active membership in the selected clinic. Returns current_tenant_id, clinic-local roles, and flattened clinic-local permission slugs. Refetch after clinic changes. X-Tenant-Id is returned as a response header on successful clinic requests. Headers and payload fields never grant membership or platform privileges.
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/token:
    post:
      tags: [Users]
      summary: Create a Sanctum bearer token
      description: Use this for Swagger UI testing. The Next.js frontend can continue using the cookie-based Sanctum flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  example: password
                token_name:
                  type: string
                  nullable: true
                  example: swagger
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  statusCode: { type: integer, example: 201 }
                  message: { type: string, example: Token created. }
                  code: { type: string, nullable: true, example: null }
                  data:
                    type: object
                    properties:
                      token_type: { type: string, example: Bearer }
                      access_token: { type: string, example: 1|example-token-value }
                  errors: { type: object, nullable: true, example: null }
                  meta: { type: object, nullable: true, example: null }
                  requestId: { type: string, nullable: true, example: 018fe4f3-8b34-7cc9-9f3f-b37a2d5f7c6e }
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Users]
      summary: Revoke the current Sanctum bearer token
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
  /api/dashboard/summary:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Dashboard]
      summary: Get overview dashboard metrics
      responses:
        "200":
          description: Dashboard summary.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummary" }
  /api/patients:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Patients]
      summary: List patients
      parameters:
        - name: archived
          in: query
          required: false
          description: Filter archived patients. Defaults to active patients only.
          schema:
            type: string
            enum: [without, with, only]
            default: without
        - name: search
          in: query
          required: false
          description: Search by patient id, first name, last name, address/location text, notes, or emergency contact details.
          schema:
            type: string
            maxLength: 255
            example: Jane Doe
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
            example: 15
      responses:
        "200":
          description: Paginated patient list in the current frontend shape.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          patients:
                            type: array
                            items:
                              $ref: "#/components/schemas/Patient"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Patients]
      summary: Create patient
      requestBody:
        $ref: "#/components/requestBodies/PatientBody"
      responses:
        "201":
          description: Created patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/patients/{patient}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Patients]
      summary: Get patient
      responses:
        "200":
          description: Patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Patients]
      summary: Update patient
      description: Requires patients.update for demographics, contact, appointment context, and notes fields. Requires patients.medical.update for allergies, medications, and medical_alerts.
      requestBody:
        $ref: "#/components/requestBodies/PatientUpdateBody"
      responses:
        "200":
          description: Updated patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "403":
          description: The authenticated user cannot update one or more submitted patient fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiErrorEnvelope"
                  - type: object
                    properties:
                      statusCode: { type: integer, example: 403 }
                      message: { type: string, example: This action is unauthorized. }
                      code: { type: string, example: FORBIDDEN }
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Patients]
      summary: Update patient
      description: Requires patients.update for demographics, contact, appointment context, and notes fields. Requires patients.medical.update for allergies, medications, and medical_alerts.
      requestBody:
        $ref: "#/components/requestBodies/PatientUpdateBody"
      responses:
        "200":
          description: Updated patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "403":
          description: The authenticated user cannot update one or more submitted patient fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiErrorEnvelope"
                  - type: object
                    properties:
                      statusCode: { type: integer, example: 403 }
                      message: { type: string, example: This action is unauthorized. }
                      code: { type: string, example: FORBIDDEN }
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Patients]
      summary: Archive patient
      description: Requires patients.archive. Archives the patient record without hard-deleting it, preserving linked appointments, clinical notes, invoices, and other history.
      responses:
        "200":
          description: Patient archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
        "403":
          description: The authenticated user cannot archive patients.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiErrorEnvelope"
                  - type: object
                    properties:
                      statusCode: { type: integer, example: 403 }
                      message: { type: string, example: This action is unauthorized. }
                      code: { type: string, example: FORBIDDEN }
  /api/patients/{patient}/update:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    put:
      tags: [Patients]
      summary: Legacy patient update endpoint
      deprecated: true
      requestBody:
        $ref: "#/components/requestBodies/PatientUpdateBody"
      responses:
        "200":
          description: Updated patient object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
  /api/patients/{patient}/delete:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/PatientId"
    delete:
      tags: [Patients]
      summary: Legacy patient archive endpoint
      deprecated: true
      description: Legacy route retained for compatibility. It archives the patient and does not hard-delete the record.
      responses:
        "200":
          description: Patient archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEnvelope"
  /api/appointment-locations:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Appointments]
      summary: List rooms and their chairs for booking selectors
      description: Requires appointments.view permission or the admin role. Returns canonical integer room and chair IDs ordered by name then ID. Rooms are exclusive booking resources, including when different chairs are selected within the same room.
      responses:
        "200":
          description: Available location records. This is an inventory list, not a time-specific availability query.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rooms: { type: array, items: { $ref: "#/components/schemas/AppointmentRoom" } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/appointments:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Appointments]
      summary: List appointments
      description: Requires appointments.view permission or the admin role. The optional date filters starts in the application timezone (UTC). Responses contain canonical numeric IDs, display names, and ISO 8601 UTC startsAt/endsAt fields.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-10-05"
      responses:
        "200":
          description: Appointment list with display-ready fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          appointments:
                            type: array
                            items:
                              $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Appointments]
      summary: Create appointment
      description: Requires appointments.create permission or the admin role. Creates a scheduled appointment. Accepts canonical snake_case fields and documented camelCase aliases; canonical values take precedence. Archived patients and inactive treatments cannot be selected. Duration defaults to the selected treatment duration or 30 minutes. Optional chair_id derives room_id when room_id is omitted. Provider, chair, and room overlaps with active appointments return 422, including across midnight; adjacent intervals are allowed. Offset timestamps are normalized to UTC. See docs/appointment-workflow.md for transition and locking rules.
      requestBody:
        $ref: "#/components/requestBodies/AppointmentBody"
      responses:
        "201":
          description: Appointment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    get:
      tags: [Appointments]
      summary: Get appointment
      description: Requires appointments.view permission or the admin role.
      responses:
        "200":
          description: Appointment details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Appointments]
      summary: Update appointment
      description: Requires appointments.update permission or the admin role. PATCH and PUT both accept partial updates and preserve omitted fields. Changes to provider, chair, room, start, treatment-derived duration, or explicit duration are checked for overlaps. Completed, cancelled, and no_show appointments cannot be rescheduled. Appointments with clinical notes, including soft-deleted notes, cannot change patient/provider. Appointments linked to tasks cannot change patient. Status changes use the workflow rules described in docs/appointment-workflow.md. Repeating the current status is idempotent and preserves timestamps.
      requestBody:
        $ref: "#/components/requestBodies/AppointmentUpdateBody"
      responses:
        "200":
          description: Appointment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Appointments]
      summary: Update appointment
      description: Requires appointments.update permission or the admin role. Uses the same partial update, conflict validation, and status transition rules as PATCH.
      requestBody:
        $ref: "#/components/requestBodies/AppointmentUpdateBody"
      responses:
        "200":
          description: Appointment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Appointments]
      summary: Delete appointment
      description: Requires appointments.delete permission or the admin role. Physically deletes appointments without clinical notes. Notes, including soft-deleted notes, prevent deletion with a 422 appointment_id error. Use the cancel action to retain appointment history and release its slot.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}/check-in:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Mark appointment as checked in
      description: Requires appointments.update permission or the admin role. Only scheduled appointments can transition to checked_in. Repeating checked_in succeeds without changing checked_in_at. Other transitions return 422.
      responses:
        "200":
          description: Appointment status changed to checked_in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}/complete:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Mark appointment as completed
      description: Requires appointments.update permission or the admin role. Only in_progress appointments can transition to completed; first use PATCH with status in_progress after check-in. Repeating completed preserves completed_at. Other transitions return 422.
      responses:
        "200":
          description: Appointment status changed to completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/appointments/{appointment}/cancel:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Cancel appointment
      description: Requires appointments.update permission or the admin role. Scheduled, checked_in, and in_progress appointments may be cancelled. Cancellation releases provider and location reservations. Repeating cancellation preserves cancelled_at and retains the existing reason when omitted. Completed and no_show appointments cannot be cancelled.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: Alias for cancellation_reason. Canonical cancellation_reason takes precedence when both are present.
                  example: Patient requested cancellation.
                cancellation_reason:
                  type: string
                  nullable: true
                  maxLength: 2000
      responses:
        "200":
          description: Appointment status changed to cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/dentists:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Dentists]
      summary: List dentists
      responses:
        "200":
          $ref: "#/components/responses/DentistList"
    post:
      tags: [Dentists]
      summary: Create dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistBody"
      responses:
        "201":
          $ref: "#/components/responses/DentistEnvelope"
  /api/dentists/{dentist}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/DentistId"
    get:
      tags: [Dentists]
      summary: Get dentist
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    patch:
      tags: [Dentists]
      summary: Update dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    put:
      tags: [Dentists]
      summary: Update dentist
      requestBody:
        $ref: "#/components/requestBodies/DentistUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/DentistEnvelope"
    delete:
      tags: [Dentists]
      summary: Delete dentist
      description: Providers with clinical notes, including soft-deleted notes, cannot be deleted. Such requests return 422 with a dentist_id error to preserve clinical history.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/treatments:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
    get:
      tags: [Treatments]
      summary: List treatments
      description: Requires treatments.view permission or the admin role. Returns all matching treatments ordered by name then ID, without pagination. Omit active to include historical inactive treatments. Use active=1 for booking selectors.
      parameters:
        - name: active
          in: query
          required: false
          description: Filter by active status. Use 1 for active treatments or 0 for inactive treatments. Other query strings, including true and false, are rejected.
          schema: { type: integer, enum: [0, 1] }
      responses:
        "200":
          $ref: "#/components/responses/TreatmentList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Treatments]
      summary: Create treatment
      description: Requires treatments.create permission or the admin role. Treatments default to active when active is omitted.
      requestBody:
        $ref: "#/components/requestBodies/TreatmentBody"
      responses:
        "201":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/treatments/{treatment}:
    parameters:
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/TreatmentId"
    get:
      tags: [Treatments]
      summary: Get treatment
      description: Requires treatments.view permission or the admin role. Inactive treatments remain accessible for historical records.
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Treatments]
      summary: Update treatment
      description: Requires treatments.update permission or the admin role. Only supplied fields change. Set active to false to deactivate or true to reactivate.
      requestBody:
        $ref: "#/components/requestBodies/TreatmentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Treatments]
      summary: Update treatment
      description: Requires treatments.update permission or the admin role. Accepts partial updates with the same semantics as PATCH.
      requestBody:
        $ref: "#/components/requestBodies/TreatmentUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/TreatmentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Treatments]
      summary: Deactivate treatment
      description: Requires treatments.delete permission or the admin role. Sets active to false and retains the treatment and all appointment references. Repeated deletion succeeds. Returns message "Treatment successfully deactivated." with null data.
      responses:
        "200":
          $ref: "#/components/responses/DeleteMessage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
