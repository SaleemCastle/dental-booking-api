        medications:
          type: array
          nullable: true
          items: { type: string, maxLength: 255 }
          example: [Metformin]
        medical_alerts:
          type: array
          nullable: true
          items: { type: string, maxLength: 255 }
          example: [Diabetes]
    PatientUpdateRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        appointments: { type: string, maxLength: 255 }
        sex: { type: string, maxLength: 255 }
        streetAddress: { type: string, maxLength: 255 }
        town: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 255 }
        notes: { type: string }
        emergency_contact_name: { type: string, nullable: true, maxLength: 255 }
        emergency_contact_phone: { type: string, nullable: true, maxLength: 50 }
        emergency_contact_relationship: { type: string, nullable: true, maxLength: 100 }
        allergies:
          type: array
          nullable: true
          items: { type: string, maxLength: 255 }
        medications:
          type: array
          nullable: true
          items: { type: string, maxLength: 255 }
        medical_alerts:
